<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ICCA AI-Enhanced Database Development Plan</title>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
            overflow-x: hidden;
        }
        
        .infographic-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            animation: fadeIn 1s ease-in-out;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes slideInLeft {
            from { opacity: 0; transform: translateX(-50px); }
            to { opacity: 1; transform: translateX(0); }
        }
        
        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(50px); }
            to { opacity: 1; transform: translateX(0); }
        }
        
        @keyframes bounceIn {
            0% { opacity: 0; transform: scale(0.3); }
            50% { opacity: 1; transform: scale(1.05); }
            70% { transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1); }
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        
        .header {
            background: white;
            border-radius: 20px;
            padding: 40px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
            animation: slideInLeft 1s ease-out 0.2s both;
            position: relative;
            overflow: hidden;
        }
        
        .header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.1), transparent);
            transform: rotate(45deg);
            transition: all 0.6s;
            opacity: 0;
        }
        
        .header:hover::before {
            opacity: 1;
            transform: rotate(45deg) translate(100%, 100%);
        }
        
        .header h1 {
            font-size: 2.5rem;
            color: #2c3e50;
            margin-bottom: 10px;
            animation: pulse 2s ease-in-out infinite;
        }
        
        .header .subtitle {
            font-size: 1.2rem;
            color: #7f8c8d;
            margin-bottom: 20px;
        }
        
        .key-metrics {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
            animation: slideInRight 1s ease-out 0.4s both;
        }
        
        .metric-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        
        .metric-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(3, 169, 244, 0.2), transparent);
            transition: left 0.5s;
        }
        
        .metric-card:hover::before {
            left: 100%;
        }
        
        .metric-card:hover {
            transform: translateY(-10px) scale(1.05);
            box-shadow: 0 15px 30px rgba(0,0,0,0.2);
        }
        
        .metric-number {
            font-size: 2.5rem;
            font-weight: bold;
            color: #e74c3c;
            margin-bottom: 10px;
            transition: color 0.3s ease;
        }
        
        .metric-card:hover .metric-number {
            color: #3498db;
        }
        
        .metric-label {
            font-size: 1rem;
            color: #7f8c8d;
        }
        
        .phases-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .phase-card {
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: all 0.4s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        
        .phase-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
        }
        
        .phase-header {
            display: flex;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .phase-number {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background: #3498db;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            margin-right: 15px;
            transition: all 0.3s ease;
        }
        
        .phase-card:hover .phase-number {
            transform: rotate(360deg);
            background: #e74c3c;
        }
        
        .phase-title {
            font-size: 1.3rem;
            color: #2c3e50;
            font-weight: bold;
        }
        
        .phase-details {
            margin-bottom: 15px;
            transition: all 0.3s ease;
        }
        
        .phase-card:hover .phase-details {
            transform: translateX(10px);
        }
        
        .phase-investment {
            background: #ecf0f1;
            padding: 10px;
            border-radius: 8px;
            font-weight: bold;
            color: #27ae60;
            transition: all 0.3s ease;
        }
        
        .phase-card:hover .phase-investment {
            background: #27ae60;
            color: white;
        }
        
        .expandable-section {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
        }
        
        .section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            margin-bottom: 20px;
        }
        
        .section-header:hover {
            color: #3498db;
        }
        
        .expand-icon {
            font-size: 1.5rem;
            transition: transform 0.3s ease;
        }
        
        .expand-icon.expanded {
            transform: rotate(180deg);
        }
        
        .section-content {
            max-height: 0;
            overflow: hidden;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 0;
        }
        
        .section-content.expanded {
            max-height: 1000px;
            opacity: 1;
            margin-top: 20px;
        }
        
        .tech-items {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 15px;
            margin-top: 20px;
        }
        
        .tech-item {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            border-left: 4px solid #3498db;
            transition: all 0.3s ease;
            cursor: pointer;
        }
        
        .tech-item:hover {
            background: #3498db;
            color: white;
            transform: translateX(10px);
            border-left-color: #e74c3c;
        }
        
        .outcomes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .outcome-card {
            background: white;
            border-radius: 15px;
            padding: 25px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        
        .outcome-card::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 3px;
            background: linear-gradient(90deg, #3498db, #e74c3c);
            transition: width 0.3s ease;
        }
        
        .outcome-card:hover::after {
            width: 100%;
        }
        
        .outcome-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 15px 30px rgba(0,0,0,0.2);
        }
        
        .improvement-bar {
            background: #ecf0f1;
            height: 20px;
            border-radius: 10px;
            margin: 10px 0;
            position: relative;
            overflow: hidden;
        }
        
        .improvement-fill {
            height: 100%;
            background: linear-gradient(90deg, #27ae60, #2ecc71);
            border-radius: 10px;
            transition: all 1.5s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
            overflow: hidden;
        }
        
        .improvement-fill::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.4), transparent);
            animation: shimmer 2s infinite;
        }
        
        @keyframes shimmer {
            0% { left: -100%; }
            100% { left: 100%; }
        }
        
        .timeline {
            background: white;
            border-radius: 15px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        
        .timeline-item {
            display: flex;
            margin-bottom: 20px;
            position: relative;
            cursor: pointer;
            transition: all 0.3s ease;
            padding: 15px;
            border-radius: 10px;
        }
        
        .timeline-item:hover {
            background: #f8f9fa;
            transform: translateX(10px);
        }
        
        .timeline-marker {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            background: #3498db;
            margin-right: 20px;
            margin-top: 5px;
            transition: all 0.3s ease;
            position: relative;
        }
        
        .timeline-item:hover .timeline-marker {
            background: #e74c3c;
            transform: scale(1.2);
            box-shadow: 0 0 15px rgba(231, 76, 60, 0.5);
        }
        
        .timeline-marker::after {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 10px;
            height: 10px;
            background: white;
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: all 0.3s ease;
        }
        
        .timeline-item:hover .timeline-marker::after {
            width: 6px;
            height: 6px;
        }
        
        .timeline-content {
            flex: 1;
        }
        
        .section-title {
            font-size: 1.8rem;
            color: #2c3e50;
            margin-bottom: 20px;
            text-align: center;
            position: relative;
            animation: slideInLeft 1s ease-out;
        }
        
        .section-title::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 50%;
            width: 0;
            height: 3px;
            background: linear-gradient(90deg, #3498db, #e74c3c);
            transition: all 0.5s ease;
            transform: translateX(-50%);
        }
        
        .section-title:hover::after {
            width: 100px;
        }
        
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            animation: fadeIn 0.3s ease-out;
        }
        
        .modal-content {
            background: white;
            border-radius: 15px;
            padding: 40px;
            max-width: 600px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            animation: bounceIn 0.5s ease-out;
            position: relative;
        }
        
        .modal-close {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 1.5rem;
            cursor: pointer;
            color: #7f8c8d;
            transition: color 0.3s ease;
        }
        
        .modal-close:hover {
            color: #e74c3c;
        }
        
        .interactive-counter {
            display: inline-block;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        
        .loading-spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #3498db;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        @media (max-width: 768px) {
            .header h1 {
                font-size: 2rem;
            }
            
            .key-metrics {
                grid-template-columns: repeat(2, 1fr);
            }
            
            .phases-container {
                grid-template-columns: 1fr;
            }
            
            .modal-content {
                padding: 20px;
                width: 95%;
            }
        }
    </style>
</head>
<body>
    <div id="root"></div>
    
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        
        const Header = () => (
            <div className="header">
                <h1>ICCA AI-Enhanced Database Development Plan</h1>
                <div className="subtitle">Transforming Business Events Intelligence Through Strategic AI Integration</div>
            </div>
        );
        
        const ExecutiveSummary = () => (
            <ExpandableSection title="Executive Summary" defaultExpanded={true}>
                <div style={{fontSize: '1.1rem', lineHeight: '1.6', color: '#2c3e50'}}>
                    <p style={{marginBottom: '15px'}}><strong>The Opportunity:</strong> Transform ICCA's existing database from a member-contributed repository into the business events industry's most comprehensive, accurate, and intelligence-rich platform using proven AI agent technology and RAG (Retrieval-Augmented Generation) systems.</p>
                    <p style={{marginBottom: '15px'}}><strong>The Solution:</strong> A three-phase implementation that enhances data quality first, then expands market opportunity coverage, and then delivers Ai-enhanced business development and sales intelligence features for users positioning ICCA as the definitive source for business events intelligence while respecting the industry's cautious approach to AI adoption.</p>
                </div>
            </ExpandableSection>
        );
        
        const AnimatedCounter = ({ target, suffix = "", prefix = "" }) => {
            const [count, setCount] = useState(0);
            const [isVisible, setIsVisible] = useState(false);
            const ref = useRef();
            
            useEffect(() => {
                const observer = new IntersectionObserver(
                    ([entry]) => {
                        if (entry.isIntersecting) {
                            setIsVisible(true);
                        }
                    },
                    { threshold: 0.1 }
                );
                
                if (ref.current) {
                    observer.observe(ref.current);
                }
                
                return () => observer.disconnect();
            }, []);
            
            useEffect(() => {
                if (!isVisible) return;
                
                const isNumeric = !isNaN(target);
                if (!isNumeric) {
                    setCount(target);
                    return;
                }
                
                const duration = 2000;
                const steps = 60;
                const increment = target / steps;
                let current = 0;
                
                const timer = setInterval(() => {
                    current += increment;
                    if (current >= target) {
                        setCount(target);
                        clearInterval(timer);
                    } else {
                        setCount(Math.floor(current));
                    }
                }, duration / steps);
                
                return () => clearInterval(timer);
            }, [isVisible, target]);
            
            return (
                <span ref={ref} className="interactive-counter">
                    {prefix}{typeof target === 'number' ? count : count}{suffix}
                </span>
            );
        };
        
        const KeyMetrics = () => {
            const [selectedMetric, setSelectedMetric] = useState(null);
            
            const metrics = [
                { number: 100, suffix: "K", label: "Total Investment", detail: "Comprehensive budget covering all development phases, API costs, and infrastructure" },
                { number: 7, label: "Months Timeline", detail: "Phased approach ensuring systematic delivery and risk mitigation" },
                { number: 250, suffix: "%", label: "Expected ROI", detail: "Return on investment through efficiency gains and new revenue opportunities" },
                { number: 90, suffix: "+%", label: "Target Accuracy", detail: "AI-powered validation achieving industry-leading data quality standards" }
            ];
            
            return (
                <>
                    <div className="key-metrics">
                        {metrics.map((metric, index) => (
                            <div 
                                key={index}
                                className="metric-card" 
                                onClick={() => setSelectedMetric(metric)}
                                style={{animationDelay: `${index * 0.1}s`}}
                            >
                                <div className="metric-number">
                                    <AnimatedCounter target={metric.number} suffix={metric.suffix} prefix="$" />
                                </div>
                                <div className="metric-label">{metric.label}</div>
                            </div>
                        ))}
                    </div>
                    {selectedMetric && (
                        <Modal onClose={() => setSelectedMetric(null)}>
                            <h3>{selectedMetric.label}</h3>
                            <p style={{marginTop: '15px', lineHeight: '1.6'}}>
                                {selectedMetric.detail}
                            </p>
                        </Modal>
                    )}
                </>
            );
        };
        
        const PhaseCard = ({ phase, title, duration, investment, details, color, onClick }) => (
            <div className="phase-card" onClick={onClick}>
                <div className="phase-header">
                    <div className="phase-number" style={{background: color}}>{phase}</div>
                    <div className="phase-title">{title}</div>
                </div>
                <div className="phase-details">
                    <strong>Duration:</strong> {duration}<br/>
                    <strong>Focus:</strong> {details}
                </div>
                <div className="phase-investment">{investment}</div>
            </div>
        );
        
        const Phases = () => {
            const [selectedPhase, setSelectedPhase] = useState(null);
            
            const phases = [
                {
                    phase: "0",
                    title: "Discovery & Architecture",
                    duration: "Month 1",
                    investment: "$15,000",
                    details: "Data and infrastructure review, data quality baseline, risk assessment",
                    color: "#e74c3c",
                    fullDetails: "Review of ICCA's current database platform, SimpleView integration status, and technical capabilities. Includes data quality sampling, source website identification, and risk assessment with mitigation strategies."
                },
                {
                    phase: "1",
                    title: "Smart Data Validation",
                    duration: "Months 2-4",
                    investment: "$40,000",
                    details: "Web scraping, AI processing, quality scoring, validation workflows",
                    color: "#f39c12",
                    fullDetails: "Deploy AI-powered validation and enrichment system using web scraping and OpenAI API. Focus on enhancing existing member-contributed data and expanding database coverage into new high-value segments with automated quality scoring."
                },
                {
                    phase: "2",
                    title: "Business Intelligence Enhancement",
                    duration: "Months 5-7",
                    investment: "$45,000",
                    details: "Market intelligence, automated reports, natural language queries",
                    color: "#27ae60",
                    fullDetails: "Deploy AI tools to transform enhanced database into actionable intelligence for users through natural language querying, automated report generation, and real-time market intelligence. Includes basic export tools for member data access."
                }
            ];
            
            return (
                <>
                    <ExpandableSection title="Three-Phase Implementation" defaultExpanded={true}>
                        <div className="phases-container">
                            {phases.map((phase, index) => (
                                <PhaseCard 
                                    key={index}
                                    {...phase}
                                    onClick={() => setSelectedPhase(phase)}
                                />
                            ))}
                        </div>
                    </ExpandableSection>
                    {selectedPhase && (
                        <Modal onClose={() => setSelectedPhase(null)}>
                            <h3>Phase {selectedPhase.phase}: {selectedPhase.title}</h3>
                            <p style={{marginTop: '15px', lineHeight: '1.6'}}>
                                <strong>Duration:</strong> {selectedPhase.duration}<br/>
                                <strong>Investment:</strong> {selectedPhase.investment}
                            </p>
                            <p style={{marginTop: '15px', lineHeight: '1.6'}}>
                                {selectedPhase.fullDetails}
                            </p>
                        </Modal>
                    )}
                </>
            );
        };
        
        const TechStack = () => (
            <ExpandableSection title="Technology Architecture">
                <div className="tech-items">
                    <div className="tech-item">
                        <strong>Web Scraping</strong><br/>
                        Firecrawl with requests library for data collection
                    </div>
                    <div className="tech-item">
                        <strong>OpenAI API</strong><br/>
                        AI validation and data processing
                    </div>
                    <div className="tech-item">
                        <strong>SQL Database</strong><br/>
                        Existing database integration
                    </div>
                    <div className="tech-item">
                        <strong>User Interface</strong><br/>
                        Intuitive web interface with natural language queries
                    </div>
                </div>
            </ExpandableSection>
        );
        
        const ExpectedOutcomes = () => {
            const [selectedOutcome, setSelectedOutcome] = useState(null);
            
            const outcomes = [
                {
                    title: "Enhanced Data Quality",
                    summary: [
                        { text: "+ data accuracy (from ~60%)", counter: 85, suffix: "%" },
                        { text: "+ data completeness (from ~40%)", counter: 75, suffix: "%" },
                        { text: "Automated validation and updates", counter: null }
                    ],
                    details: {
                        title: "Revolutionary Data Quality Transformation",
                        description: "Transform ICCA's database from good to industry-leading with AI-powered precision that competitors cannot match.",
                        features: [
                            "🎯 **Real-time Validation**: Every data point cross-referenced against 50+ authoritative sources within seconds",
                            "🔍 **Smart Duplicate Detection**: AI identifies and merges duplicate entries that manual processes miss",
                            "📊 **Confidence Scoring**: Each record tagged with accuracy confidence levels (Bronze/Silver/Gold/Platinum)",
                            "⚡ **Instant Updates**: Changes to venue names, dates, or contacts updated across all records simultaneously",
                            "🌐 **Multi-language Support**: Automatic translation and standardization of international event data",
                            "📈 **Quality Metrics Dashboard**: Live tracking of data health with alerts for declining accuracy"
                        ],
                        impact: "Members gain access to the most reliable business events database in the industry, reducing research time by 80% and eliminating costly planning mistakes."
                    }
                },
                {
                    title: "Expanded Market Coverage",
                    summary: [
                        { text: "Commercial conferences discovery", counter: null },
                        { text: "Trade shows and industry exhibitions", counter: null },
                        { text: "Government/NGO events tracking", counter: null }
                    ],
                    details: {
                        title: "Unlock Hidden Market Opportunities",
                        description: "Access previously invisible market segments worth billions in untapped revenue potential for ICCA members.",
                        features: [
                            "💼 **Corporate Event Intelligence**: Track 10,000+ enterprise conferences, user summits, and customer events",
                            "🏛️ **Government & NGO Events**: Monitor diplomatic summits, policy conferences, and international forums",
                            "🎪 **Trade Show Expansion**: Cover 15,000+ industry exhibitions, buyer-seller meetups, and B2B showcases",
                            "🚀 **Startup & Tech Events**: Identify emerging conferences in AI, fintech, biotech, and climate tech",
                            "🎓 **Academic Partnerships**: Track research conferences, symposiums, and university-hosted events",
                            "🌍 **Regional Market Penetration**: Discover events in emerging markets (Southeast Asia, Africa, Latin America)",
                            "📱 **Digital Event Tracking**: Hybrid and virtual events with in-person networking components"
                        ],
                        impact: "5x expansion of addressable market, giving members first-mover advantage in high-growth sectors and untapped geographical regions."
                    }
                },
                {
                    title: "AI-Enhanced Intelligence",
                    summary: [
                        { text: 'Natural language queries: "Show me medical congresses moving to Asia in 2029"', counter: null },
                        { text: "Automated intelligence reports", counter: null },
                        { text: " reduction in report creation time", counter: 70, suffix: "%" }
                    ],
                    details: {
                        title: "AI-Powered Business Intelligence at Your Fingertips",
                        description: "Transform complex data analysis into simple conversations, making every team member a data expert.",
                        features: [
                            "🗣️ **Conversational Analytics**: 'Show me conferences moving from Europe to Asia with 500+ attendees in Q2 2024'",
                            "📊 **Instant Visualizations**: Auto-generate charts, maps, and trend analyses from natural language requests",
                            "🎯 **Smart Recommendations**: 'Based on your search, here are 12 similar opportunities you haven't considered'",
                            "⚡ **Real-time Market Alerts**: 'Notify me when luxury hospitality conferences announce venue changes'",
                            "📋 **Custom Report Builder**: 'Create a monthly report on sustainability conferences with budget ranges'",
                            "🔄 **Predictive Insights**: 'Which conference formats are trending in the healthcare sector?'",
                            "📧 **Automated Briefings**: Daily/weekly intelligence summaries tailored to member interests",
                            "🌐 **Multi-language Queries**: Ask questions in 12 languages, get comprehensive global results"
                        ],
                        impact: "Democratize data access across organizations. Junior staff can perform senior-level market analysis, while executives get instant answers to strategic questions."
                    }
                }
            ];
            
            return (
                <>
                    <ExpandableSection title="New User Value & Functionality" defaultExpanded={true}>
                        <div className="outcomes-grid">
                            {outcomes.map((outcome, index) => (
                                <div key={index} className="outcome-card" onClick={() => setSelectedOutcome(outcome)}>
                                    <h3>{outcome.title}</h3>
                                    <ul style={{textAlign: 'left', marginTop: '15px'}}>
                                        {outcome.summary.map((item, i) => (
                                            <li key={i}>
                                                {item.counter ? <AnimatedCounter target={item.counter} suffix={item.suffix} /> : null}
                                                {item.text}
                                            </li>
                                        ))}
                                    </ul>
                                </div>
                            ))}
                        </div>
                    </ExpandableSection>
                    {selectedOutcome && (
                        <Modal onClose={() => setSelectedOutcome(null)}>
                            <h2 style={{color: '#2c3e50', marginBottom: '20px'}}>{selectedOutcome.details.title}</h2>
                            <p style={{fontSize: '1.1rem', lineHeight: '1.6', marginBottom: '20px', color: '#34495e'}}>
                                {selectedOutcome.details.description}
                            </p>
                            <div style={{marginBottom: '20px'}}>
                                {selectedOutcome.details.features.map((feature, index) => (
                                    <div key={index} style={{margin: '10px 0', padding: '10px', background: '#f8f9fa', borderRadius: '8px', lineHeight: '1.5'}}>
                                        <span dangerouslySetInnerHTML={{__html: feature}} />
                                    </div>
                                ))}
                            </div>
                            <div style={{padding: '20px', background: '#e8f5e8', borderRadius: '10px', borderLeft: '4px solid #27ae60'}}>
                                <strong style={{color: '#27ae60'}}>Business Impact:</strong>
                                <p style={{marginTop: '10px', lineHeight: '1.6'}}>{selectedOutcome.details.impact}</p>
                            </div>
                        </Modal>
                    )}
                </>
            );
        };
        
        const InteractiveTimeline = () => {
            const [activeItem, setActiveItem] = useState(null);
            
            const timelineItems = [
                {
                    title: "Month 1: Discovery & Architecture Assessment",
                    description: "Database audit, quality baseline, integration planning",
                    details: "Complete technical audit of current ICCA database architecture, assess data quality through systematic sampling, identify integration opportunities with SimpleView, and document risks with mitigation strategies."
                },
                {
                    title: "Months 2-4: Smart Data Validation System",
                    description: "Web scraping integration, AI processing, quality improvements",
                    details: "Implement web scraping infrastructure, integrate OpenAI API for data validation, deploy quality scoring algorithms, and begin systematic enhancement of existing database records."
                },
                {
                    title: "Months 5-7: Intelligence Enhancement",
                    description: "Market intelligence, automated reports, staff interface",
                    details: "Build natural language query interface, implement automated report generation, create market intelligence workflows, and deploy simple web interface for ICCA staff usage."
                }
            ];
            
            return (
                <div className="timeline">
                    <h2 className="section-title">Implementation Timeline</h2>
                    {timelineItems.map((item, index) => (
                        <div 
                            key={index}
                            className="timeline-item"
                            onClick={() => setActiveItem(activeItem === index ? null : index)}
                        >
                            <div className="timeline-marker"></div>
                            <div className="timeline-content">
                                <strong>{item.title}</strong>
                                <div style={{color: '#7f8c8d', marginTop: '5px'}}>
                                    {item.description}
                                </div>
                                {activeItem === index && (
                                    <div style={{marginTop: '15px', padding: '15px', background: '#f8f9fa', borderRadius: '8px', lineHeight: '1.6'}}>
                                        {item.details}
                                    </div>
                                )}
                            </div>
                        </div>
                    ))}
                </div>
            );
        };
        
        const ExpandableSection = ({ title, children, defaultExpanded = false }) => {
            const [isExpanded, setIsExpanded] = useState(defaultExpanded);
            
            return (
                <div className="expandable-section">
                    <div 
                        className="section-header" 
                        onClick={() => setIsExpanded(!isExpanded)}
                    >
                        <h2 className="section-title" style={{marginBottom: 0, textAlign: 'left'}}>
                            {title}
                        </h2>
                        <span className={`expand-icon ${isExpanded ? 'expanded' : ''}`}>
                            ▼
                        </span>
                    </div>
                    <div className={`section-content ${isExpanded ? 'expanded' : ''}`}>
                        {children}
                    </div>
                </div>
            );
        };
        
        const Modal = ({ children, onClose }) => (
            <div className="modal-overlay" onClick={onClose}>
                <div className="modal-content" onClick={e => e.stopPropagation()}>
                    <span className="modal-close" onClick={onClose}>✕</span>
                    {children}
                </div>
            </div>
        );
        
        const App = () => (
            <div className="infographic-container">
                <Header />
                <ExecutiveSummary />
                <ExpectedOutcomes />
                <KeyMetrics />
                <Phases />
                <TechStack />
                <InteractiveTimeline />
            </div>
        );
        
        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
