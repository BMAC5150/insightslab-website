<html lang="en">

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            color: #333;
            overflow-x: hidden;
        }
        
        .infographic-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
            animation: fadeIn 1s ease-in-out;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        @keyframes slideInLeft {
            from { opacity: 0; transform: translateX(-50px); }
            to { opacity: 1; transform: translateX(0); }
        }
        
        @keyframes slideInRight {
            from { opacity: 0; transform: translateX(50px); }
            to { opacity: 1; transform: translateX(0); }
        }
        
        @keyframes bounceIn {
            0% { opacity: 0; transform: scale(0.3); }
            50% { opacity: 1; transform: scale(1.05); }
            70% { transform: scale(0.9); }
            100% { opacity: 1; transform: scale(1); }
        }
        
        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }
        
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-10px); }

            background: white;
            border-radius: 20px;
            padding: 40px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
            animation: slideInLeft 1s ease-out 0.2s both;
            position: relative;
            overflow: hidden;
        }
        
        .header::before {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.1), transparent);
            transform: rotate(45deg);
            transition: all 0.6s;
            opacity: 0;
        }
        
        .header:hover::before {
            opacity: 1;
            transform: rotate(45deg) translate(100%, 100%);
        }
        
        .header h1 {
            font-size: 2.5rem;
            color: #2c3e50;
            margin-bottom: 10px;
            animation: pulse 2s ease-in-out infinite;
        }
        
        .header .subtitle {

            color: #7f8c8d;
            margin-bottom: 20px;
        }
        
        .principles-grid {

            gap: 20px;
            margin-bottom: 30px;
            animation: slideInRight 1s ease-out 0.4s both;

        .principle-card {

            border-radius: 15px;
            padding: 25px;

            position: relative;
            overflow: hidden;
        }
        
        .principle-card::before {

            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(52, 152, 219, 0.2), transparent);
            transition: left 0.5s;
        }
        
        .principle-card:hover::before {
            left: 100%;
        }
        
        .principle-card:hover {
            transform: translateY(-8px) scale(1.02);
            box-shadow: 0 15px 30px rgba(0,0,0,0.2);
        }
        
        .principle-icon {
            font-size: 2.5rem;
            margin-bottom: 15px;
            animation: float 3s ease-in-out infinite;
        }
        
        .principle-title {
            font-size: 1.3rem;
            color: #2c3e50;
            font-weight: bold;
            margin-bottom: 10px;
        }
        
        .principle-desc {
            color: #7f8c8d;
            line-height: 1.5;
        }
        
        .architecture-diagram {
            background: white;
            border-radius: 20px;
            padding: 40px;
            margin-bottom: 30px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            text-align: center;
        }

            border: 2px dashed #3498db;
            border-radius: 15px;
            padding: 20px;
            margin: 15px 0;

            cursor: pointer;
            position: relative;
        }
        
        .system-layer:hover {
            background: #e8f4f8;
            border-color: #e74c3c;
            transform: scale(1.02);
        }
        
        .system-layer h3 {
            color: #2c3e50;
            margin-bottom: 15px;
            font-size: 1.4rem;
        }
        
        .layer-components {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 10px;
            margin-top: 15px;
        }
        
        .component-box {
            background: white;
            border: 1px solid #3498db;
            border-radius: 10px;
            padding: 15px 10px;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }
        
        .component-box::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 3px;
            background: linear-gradient(90deg, #3498db, #e74c3c);
            transition: width 0.3s ease;
        }
        
        .component-box:hover::after {
            width: 100%;
        }
        
        .component-box:hover {
            background: #3498db;
            color: white;
            transform: translateY(-3px);
        }
        
        .tech-phases {

            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            transition: all 0.4s ease;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: conic-gradient(from 0deg at 50% 50%, transparent, rgba(52, 152, 219, 0.1), transparent);
            transform: rotate(0deg);
            transition: all 0.6s ease;
            opacity: 0;
        }
        
        .phase-card:hover::before {
            opacity: 1;
            transform: rotate(360deg);
        }

        .phase-header {

            align-items: center;

            height: 50px;

            color: #2c3e50;

            overflow: hidden;

            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;

            border-radius: 15px;
            padding: 30px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);

            justify-content: space-between;
            align-items: center;
            cursor: pointer;
            margin-bottom: 20px;
        }
        
        .section-header:hover {
            color: #3498db;
        }
        
        .expand-icon {
            font-size: 1.5rem;
            transition: transform 0.3s ease;
        }
        
        .expand-icon.expanded {
            transform: rotate(180deg);
        }
        
        .section-content {
            max-height: 0;
            overflow: hidden;
            transition: all 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 0;
        }
        
        .section-content.expanded {
            max-height: 2000px;
            opacity: 1;
            margin-top: 20px;
        }
        
        .section-title {
            font-size: 1.8rem;
            color: #2c3e50;
            margin-bottom: 20px;
            text-align: center;
            position: relative;
            animation: slideInLeft 1s ease-out;
        }
        
        .section-title::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 50%;
            width: 0;
            height: 3px;
            background: linear-gradient(90deg, #3498db, #e74c3c);
            transition: all 0.5s ease;
            transform: translateX(-50%);
        }
        
        .section-title:hover::after {
            width: 100px;
        }
        
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            animation: fadeIn 0.3s ease-out;
        }
        
        .modal-content {
            background: white;
            border-radius: 15px;
            padding: 40px;
            max-width: 800px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
            animation: bounceIn 0.5s ease-out;
            position: relative;
        }
        
        .modal-close {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 1.5rem;
            cursor: pointer;
            color: #7f8c8d;
            transition: color 0.3s ease;
        }
        
        .modal-close:hover {
            color: #e74c3c;

        .cost-breakdown {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }
        
        .cost-card {
            background: linear-gradient(135deg, #f8f9fa, #e9ecef);
            border-radius: 15px;
            padding: 25px;
            text-align: center;
            transition: all 0.3s ease;
            cursor: pointer;
            border: 2px solid transparent;
        }
        
        .cost-card:hover {
            background: linear-gradient(135deg, #3498db, #2980b9);
            color: white;
            border-color: #e74c3c;
            transform: translateY(-5px) scale(1.05);
        }
        
        .cost-amount {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 10px;
        }
        
        .cost-period {
            font-size: 1.1rem;
            opacity: 0.8;
        }
        
        .interactive-counter {
            display: inline-block;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        
        @media (max-width: 768px) {
            .header h1 {
                font-size: 2rem;
            }
            
            .tech-phases {
                grid-template-columns: 1fr;
            }
            
            .principles-grid {
                grid-template-columns: 1fr;
            }
            
            .modal-content {
                padding: 20px;
                width: 95%;
            }
        }
    </style>
</head>
