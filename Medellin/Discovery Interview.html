<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medellin Convention Bureau Interview Survey - InsightsLab</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        .section-header { cursor: pointer; transition: all 0.3s ease; }
        .section-header:hover { background-color: #f3f4f6; }
    </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { useState, useEffect } = React;

function MedellinSurvey() {
    const [responses, setResponses] = useState({});
    const [expandedSections, setExpandedSections] = useState({
        section0: true, section1: false, section2: false, section3: false,
        section4: false, section5: false, section6: false, section7: false
    });
    const [isSubmitting, setIsSubmitting] = useState(false);
    const [isSubmitted, setIsSubmitted] = useState(false);
    const [saveStatus, setSaveStatus] = useState('');

    const updateResponse = (questionId, value, isMultiple = false) => {
        setResponses(prev => {
            const newResponses = isMultiple
                ? (() => {
                    const currentValues = prev[questionId] || [];
                    if (currentValues.includes(value)) {
                        return { ...prev, [questionId]: currentValues.filter(v => v !== value) };
                    } else {
                        return { ...prev, [questionId]: [...currentValues, value] };
                    }
                })()
                : { ...prev, [questionId]: value };
            localStorage.setItem('medellin_survey_responses', JSON.stringify(newResponses));
            setSaveStatus('Changes saved automatically');
            setTimeout(() => setSaveStatus(''), 3000);
            return newResponses;
        });
    };

    useEffect(() => {
        const savedResponses = localStorage.getItem('medellin_survey_responses');
        if (savedResponses) {
            setResponses(JSON.parse(savedResponses));
            setSaveStatus('Previous responses loaded');
            setTimeout(() => setSaveStatus(''), 3000);
        }
    }, []);

    const submitSurvey = async () => {
        if (!responses.name || !responses.position) {
            alert('Please fill in your name and position before submitting.');
            return;
        }
        setIsSubmitting(true);
        const submissionData = {
            timestamp: new Date().toISOString(),
            responses: responses,
            metadata: {
                userAgent: navigator.userAgent,
                submittedAt: new Date().toLocaleString(),
                responseCount: Object.keys(responses).length
            }
        };
        try {
            const response = await fetch('https://formspree.io/f/mdkzbddk', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    subject: `Medellin DMO Interview Survey Response from ${responses.name}`,
                    message: JSON.stringify(submissionData, null, 2),
                    _replyto: 'survey@dmoinsightslab.com'
                })
            });
            if (response.ok) {
                setIsSubmitted(true);
                localStorage.removeItem('medellin_survey_responses');
                window.scrollTo({ top: 0, behavior: 'smooth' });
            } else {
                throw new Error('Submission failed');
            }
        } catch (error) {
            const dataStr = JSON.stringify(submissionData, null, 2);
            const dataBlob = new Blob([dataStr], { type: 'application/json' });
            const url = URL.createObjectURL(dataBlob);
            const link = document.createElement('a');
            link.href = url;
            link.download = `medellin-survey-${responses.name || 'response'}-${Date.now()}.json`;
            link.click();
            alert('There was an issue with online submission. Your responses have been downloaded as a file. Please email this file to survey@dmoinsightslab.com');
        } finally {
            setIsSubmitting(false);
        }
    };

    const exportResponses = () => {
        const dataStr = JSON.stringify(responses, null, 2);
        const dataBlob = new Blob([dataStr], { type: 'application/json' });
        const url = URL.createObjectURL(dataBlob);
        const link = document.createElement('a');
        link.href = url;
        link.download = `medellin-survey-backup-${Date.now()}.json`;
        link.click();
    };

    const toggleSection = (sectionId) => {
        setExpandedSections(prev => ({
            ...prev,
            [sectionId]: !prev[sectionId]
        }));
    };

    const SectionHeader = ({ id, title, icon, isExpanded, color = "blue" }) => (
        <div className={`bg-${color}-50 border-l-4 border-${color}-500 p-4 section-header`}
            onClick={() => toggleSection(id)}>
            <div className="flex items-center justify-between">
                <div className="flex items-center space-x-3">
                    <span className="text-2xl">{icon}</span>
                    <h2 className="text-xl font-semibold text-gray-800">{title}</h2>
                </div>
                <span className="text-gray-600">{isExpanded ? '▼' : '▶'}</span>
            </div>
        </div>
    );

    const CheckboxGroup = ({ questionId, options, allowOther = false, otherLabel = "Other" }) => (
        <div className="space-y-2">
            {options.map((option, index) =>
                <label key={index} className="flex items-start space-x-3 p-2 hover:bg-gray-50 rounded">
                    <input
                        type="checkbox"
                        className="mt-1 h-4 w-4 text-blue-600 rounded border-gray-300"
                        checked={(responses[questionId] || []).includes(option)}
                        onChange={() => updateResponse(questionId, option, true)}
                    />
                    <span className="text-gray-700">{option}</span>
                </label>
            )}
            {allowOther &&
                <div className="flex items-center space-x-3 p-2">
                    <input
                        type="checkbox"
                        className="mt-1 h-4 w-4 text-blue-600 rounded border-gray-300"
                        checked={responses[`${questionId}_other_checked`] || false}
                        onChange={() => updateResponse(`${questionId}_other_checked`, !responses[`${questionId}_other_checked`])}
                    />
                    <div className="flex-1 flex items-center space-x-2">
                        <span className="text-gray-700">{otherLabel}:</span>
                        <input
                            type="text"
                            className="flex-1 px-3 py-1 border border-gray-300 rounded-md text-sm"
                            placeholder="Please specify..."
                            value={responses[`${questionId}_other`] || ''}
                            onChange={e => updateResponse(`${questionId}_other`, e.target.value)}
                        />
                    </div>
                </div>
            }
        </div>
    );

    const TextArea = ({ questionId, placeholder = "Please share your thoughts...", rows = 3 }) => (
        <textarea
            className="w-full px-3 py-2 border border-gray-300 rounded-md resize-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
            rows={rows}
            placeholder={placeholder}
            value={responses[questionId] || ''}
            onChange={e => updateResponse(questionId, e.target.value)}
        />
    );

    const RadioGroup = ({ questionId, options }) => (
        <div className="space-y-2">
            {options.map((option, index) =>
                <label key={index} className="flex items-center space-x-3 p-2 hover:bg-gray-50 rounded">
                    <input
                        type="radio"
                        name={questionId}
                        className="h-4 w-4 text-blue-600 border-gray-300"
                        checked={responses[questionId] === option}
                        onChange={() => updateResponse(questionId, option)}
                    />
                    <span className="text-gray-700">{option}</span>
                </label>
            )}
        </div>
    );

    if (isSubmitted) {
        return (
            <div className="min-h-screen bg-gradient-to-br from-green-50 to-blue-50 flex items-center justify-center py-8">
                <div className="max-w-2xl mx-auto px-4">
                    <div className="bg-white rounded-lg shadow-xl p-8 text-center">
                        <div className="text-6xl mb-6">✅</div>
                        <h1 className="text-3xl font-bold text-gray-800 mb-4">Thank You!</h1>
                        <div className="space-y-4 text-gray-600">
                            <p className="text-lg">Your survey response has been submitted successfully.</p>
                            <div className="bg-blue-50 border border-blue-200 rounded-lg p-4 mt-6">
                                <h3 className="font-semibold text-blue-800 mb-2">Next Steps:</h3>
                                <ul className="text-sm text-blue-700 space-y-1">
                                    <li>• We'll review your responses within 2 business days</li>
                                    <li>• Our team will contact you to schedule a follow-up interview</li>
                                </ul>
                            </div>
                            <p className="text-sm text-gray-500 mt-6">
                                Contact: survey@dmoinsightslab.com<br />
                                Reference ID: {Date.now()}
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        );
    }

    return (
        <div className="min-h-screen bg-gray-50 py-8">
            <div className="max-w-4xl mx-auto px-4">
                {/* HEADER */}
                <div className="bg-white rounded-lg shadow-lg p-8 mb-6">
                    <div className="text-center">
                        <h1 className="text-3xl font-bold text-gray-800 mb-4">Medellin Convention Bureau</h1>
                        <h2 className="text-xl text-blue-600 mb-4">Interview Discovery Survey</h2>
                        <div className="bg-blue-50 border border-blue-200 rounded-lg p-4 max-w-2xl mx-auto">
                            <p className="text-gray-700 text-sm">
                                Please complete this interview survey before your scheduled conversation. Your responses are confidential and will help us understand your information needs and business goals. <span className="block text-blue-600 font-medium mt-2">Time needed: 10-15 minutes</span>
                            </p>
                        </div>
                    </div>
                </div>

                {/* SECTION 0 */}
                <div className="bg-white rounded-lg shadow-lg mb-4">
                    <SectionHeader
                        id="section0"
                        title="Your Role & Responsibilities"
                        icon="👤"
                        isExpanded={expandedSections.section0}
                        color="green"
                    />
                    {expandedSections.section0 &&
                        <div className="p-6 space-y-6">
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-2">Name</label>
                                    <input
                                        type="text"
                                        className="w-full px-3 py-2 border border-gray-300 rounded-md"
                                        value={responses.name || ''}
                                        onChange={e => updateResponse('name', e.target.value)}
                                    />
                                </div>
                                <div>
                                    <label className="block text-sm font-medium text-gray-700 mb-2">Position</label>
                                    <input
                                        type="text"
                                        className="w-full px-3 py-2 border border-gray-300 rounded-md"
                                        value={responses.position || ''}
                                        onChange={e => updateResponse('position', e.target.value)}
                                    />
                                </div>
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-3">
                                    What are your main responsibilities? (Check all that apply)
                                </label>
                                <CheckboxGroup
                                    questionId="responsibilities"
                                    options={[
                                        "Attracting new events to Medellin",
                                        "Working with event organizers during planning",
                                        "Marketing Medellin as a destination",
                                        "Managing relationships with hotels/venues",
                                        "Financial planning and budgets",
                                        "Operations and logistics"
                                    ]}
                                    allowOther={true}
                                />
                            </div>
                        </div>
                    }
                </div>

                {/* SECTION 1 */}
                <div className="bg-white rounded-lg shadow-lg mb-4">
                    <SectionHeader
                        id="section1"
                        title="What Success Looks Like"
                        icon="🎯"
                        isExpanded={expandedSections.section1}
                        color="purple"
                    />
                    {expandedSections.section1 &&
                        <div className="p-6 space-y-6">
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-3">
                                    What are the most important goals for your work?
                                    <span className="text-blue-600 font-medium block">Pick your TOP 3 and mark them 1, 2, 3 (1 = most important)</span>
                                </label>
                                <div className="space-y-3">
                                    {[
                                        "Bring more events to Medellin each year",
                                        "Attract bigger, more important events",
                                        "Make more money/revenue from events",
                                        "Beat our competitor cities (Bogotá, Cartagena, etc.)",
                                        "Make our existing clients happy",
                                        "Work more efficiently with less effort",
                                        "Show the city government we're successful",
                                        "Build Medellin's reputation internationally"
                                    ].map((goal, index) =>
                                        <div key={index} className="flex items-center space-x-3 p-3 border border-gray-200 rounded hover:bg-gray-50">
                                            <select
                                                className="w-16 px-2 py-1 border border-gray-300 rounded text-sm"
                                                value={responses[`goal_priority_${index}`] || ''}
                                                onChange={e => updateResponse(`goal_priority_${index}`, e.target.value)}
                                            >
                                                <option value="">-</option>
                                                <option value="1">1</option>
                                                <option value="2">2</option>
                                                <option value="3">3</option>
                                            </select>
                                            <span className="text-gray-700">{goal}</span>
                                        </div>
                                    )}
                                    <div className="flex items-center space-x-3 p-3 border border-gray-200 rounded">
                                        <select
                                            className="w-16 px-2 py-1 border border-gray-300 rounded text-sm"
                                            value={responses.goal_priority_other || ''}
                                            onChange={e => updateResponse('goal_priority_other', e.target.value)}
                                        >
                                            <option value="">-</option>
                                            <option value="1">1</option>
                                            <option value="2">2</option>
                                            <option value="3">3</option>
                                        </select>
                                        <input
                                            type="text"
                                            className="flex-1 px-3 py-1 border border-gray-300 rounded-md text-sm"
                                            placeholder="Other goal..."
                                            value={responses.goal_other || ''}
                                            onChange={e => updateResponse('goal_other', e.target.value)}
                                        />
                                    </div>
                                </div>
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-2">
                                    What would make you feel most successful this year?
                                </label>
                                <TextArea questionId="success_feeling" placeholder="Describe what success looks like for you..." />
                            </div>
                        </div>
                    }
                </div>

                {/* SECTION 2 */}
                <div className="bg-white rounded-lg shadow-lg mb-4">
                    <SectionHeader
                        id="section2"
                        title="Current Challenges"
                        icon="🧩"
                        isExpanded={expandedSections.section2}
                        color="yellow"
                    />
                    {expandedSections.section2 &&
                        <div className="p-6 space-y-6">
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-2">
                                    What are your biggest challenges when trying to achieve your goals?
                                </label>
                                <CheckboxGroup
                                    questionId="challenges"
                                    options={[
                                        "Not enough qualified leads for new events",
                                        "Competition from other cities",
                                        "Lack of marketing budget/resources",
                                        "Not enough data about target audiences",
                                        "Hard to measure impact of our events",
                                        "Data is out of date/inaccurate",
                                        "No easy way to track performance over time"
                                    ]}
                                    allowOther={true}
                                />
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-2">
                                    Please share a specific recent example of a challenge you or your team faced related to data or reporting.
                                </label>
                                <TextArea questionId="challenges_example" placeholder="Please share a brief story..." />
                            </div>
                        </div>
                    }
                </div>

                {/* SECTION 3 */}
                <div className="bg-white rounded-lg shadow-lg mb-4">
                    <SectionHeader
                        id="section3"
                        title="Information Needs"
                        icon="📊"
                        isExpanded={expandedSections.section3}
                        color="blue"
                    />
                    {expandedSections.section3 &&
                        <div className="p-6 space-y-6">
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-3">
                                    What are the most important types of information or data you need to do your job well? (Check all that apply)
                                </label>
                                <CheckboxGroup
                                    questionId="info_needs"
                                    options={[
                                        "Which clients are most valuable",
                                        "Where leads are coming from",
                                        "How many events we win vs lose",
                                        "Why we win/lose business",
                                        "Economic impact of events",
                                        "Event attendee feedback",
                                        "Event performance vs competitors"
                                    ]}
                                    allowOther={true}
                                />
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-2">
                                    Are there any important types of information or data you cannot get today?
                                </label>
                                <TextArea questionId="info_missing" placeholder="Describe data/information you wish you had..." />
                            </div>
                        </div>
                    }
                </div>

                {/* SECTION 4 */}
                <div className="bg-white rounded-lg shadow-lg mb-4">
                    <SectionHeader
                        id="section4"
                        title="Systems & Processes"
                        icon="🖥️"
                        isExpanded={expandedSections.section4}
                        color="cyan"
                    />
                    {expandedSections.section4 &&
                        <div className="p-6 space-y-6">
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-3">
                                    Which technology systems do you use most for your job? (Check all that apply)
                                </label>
                                <CheckboxGroup
                                    questionId="systems"
                                    options={[
                                        "CRM",
                                        "Excel/Spreadsheets",
                                        "Website CMS",
                                        "Email marketing tool",
                                        "Finance/budgeting system",
                                        "Event management platform"
                                    ]}
                                    allowOther={true}
                                />
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-2">
                                    Briefly describe how you collect, store, and share data or reports today.
                                </label>
                                <TextArea questionId="systems_description" placeholder="e.g., We use Excel for tracking leads and share via email..." />
                            </div>
                        </div>
                    }
                </div>

                {/* SECTION 5 */}
                <div className="bg-white rounded-lg shadow-lg mb-4">
                    <SectionHeader
                        id="section5"
                        title="Reporting & KPIs"
                        icon="📈"
                        isExpanded={expandedSections.section5}
                        color="fuchsia"
                    />
                    {expandedSections.section5 &&
                        <div className="p-6 space-y-6">
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-3">
                                    Which reports or KPIs do you use or look at regularly? (Check all that apply)
                                </label>
                                <CheckboxGroup
                                    questionId="kpis"
                                    options={[
                                        "Number of new events won",
                                        "Revenue from events",
                                        "Event attendee numbers",
                                        "Satisfaction/Net Promoter Score",
                                        "ROI on marketing",
                                        "Conversion rate from lead to event",
                                        "Social media engagement"
                                    ]}
                                    allowOther={true}
                                />
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-2">
                                    What do you wish you could measure or report on that you can't today?
                                </label>
                                <TextArea questionId="kpis_missing" placeholder="Describe your reporting wishlist..." />
                            </div>
                        </div>
                    }
                </div>

                {/* SECTION 6 */}
                <div className="bg-white rounded-lg shadow-lg mb-4">
                    <SectionHeader
                        id="section6"
                        title="Decision-Making & Culture"
                        icon="🤝"
                        isExpanded={expandedSections.section6}
                        color="rose"
                    />
                    {expandedSections.section6 &&
                        <div className="p-6 space-y-6">
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-3">
                                    How are key decisions made in your team/department?
                                </label>
                                <RadioGroup
                                    questionId="decision_culture"
                                    options={[
                                        "Mostly by management experience",
                                        "Mostly using available data/reports",
                                        "Equal mix of experience and data",
                                        "Other (please explain below)"
                                    ]}
                                />
                                {responses.decision_culture === "Other (please explain below)" &&
                                    <TextArea questionId="decision_culture_other" placeholder="Explain your answer..." rows={2} />
                                }
                            </div>
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-2">
                                    What would help your team use data more confidently in decision-making?
                                </label>
                                <TextArea questionId="decision_help" placeholder="Share your ideas or wishes..." />
                            </div>
                        </div>
                    }
                </div>

                {/* SECTION 7 */}
                <div className="bg-white rounded-lg shadow-lg mb-4">
                    <SectionHeader
                        id="section7"
                        title="Other Comments & Suggestions"
                        icon="💡"
                        isExpanded={expandedSections.section7}
                        color="amber"
                    />
                    {expandedSections.section7 &&
                        <div className="p-6 space-y-6">
                            <div>
                                <label className="block text-sm font-medium text-gray-700 mb-2">
                                    Anything else we should know? Suggestions to make your work with data easier?
                                </label>
                                <TextArea questionId="final_comments" placeholder="Your comments and suggestions..." rows={3} />
                            </div>
                        </div>
                    }
                </div>

                {saveStatus &&
                    <div className="bg-green-100 border border-green-300 rounded p-2 mb-4 text-center">
                        <span className="text-green-700 text-sm">{saveStatus}</span>
                    </div>
                }

                {/* SUBMIT SECTION */}
                <div className="bg-gradient-to-r from-blue-50 to-green-50 border border-blue-200 rounded-lg p-6">
                    <div className="text-center mb-6">
                        <div className="text-6xl mb-4">🎯</div>
                        <h3 className="text-xl font-semibold text-gray-800 mb-2">Ready to Submit?</h3>
                        <p className="text-gray-600 mb-4">
                            Please review your responses and submit when ready. Your information will help us create better data solutions for Medellin's success.
                        </p>
                    </div>
                    <div className="flex flex-col sm:flex-row gap-4 justify-center">
                        <button
                            onClick={exportResponses}
                            className="flex items-center justify-center space-x-2 bg-gray-100 hover:bg-gray-200 text-gray-700 px-6 py-3 rounded-lg transition-colors"
                        >
                            <span className="text-xl">💾</span>
                            <span>Save Backup Copy</span>
                        </button>
                        <button
                            onClick={submitSurvey}
                            disabled={isSubmitting || !responses.name || !responses.position}
                            className="flex items-center justify-center space-x-2 bg-blue-600 hover:bg-blue-700 disabled:bg-gray-400 text-white px-8 py-3 rounded-lg transition-colors font-medium"
                        >
                            <span className="text-xl">📧</span>
                            <span>{isSubmitting ? 'Submitting...' : 'Submit Survey'}</span>
                        </button>
                    </div>
                    <p className="text-xs text-gray-500 mt-4 text-center">
                        Your responses are automatically saved as you type. This survey is confidential and will only be used to improve Medellin's data capabilities.
                    </p>
                </div>
            </div>
        </div>
    );
}

ReactDOM.render(<MedellinSurvey />, document.getElementById('root'));
</script>
</body>
</html>
