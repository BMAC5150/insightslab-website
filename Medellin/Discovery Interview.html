<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Medellin Convention Bureau Interview Discovery Survey</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    .section-header { cursor: pointer; transition: all 0.3s ease; }
    .section-header:hover { background-color: #f3f4f6; }
    textarea { min-height: 60px; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

const { useState, useEffect } = React;

function MedellinSurvey() {
  // Which canvases are expanded by default?
  const [expanded, setExpanded] = useState({
    canvas1: true, canvas2: false, canvas3: false, canvas4: false, canvas5: false, canvas6: false, canvas7: false, canvas8: false
  });
  const [responses, setResponses] = useState({});
  const [isSubmitting, setIsSubmitting] = useState(false);
  const [isSubmitted, setIsSubmitted] = useState(false);
  const [saveStatus, setSaveStatus] = useState('');

  // For local autosave
  useEffect(() => {
    const saved = localStorage.getItem('medellin_interview_survey');
    if (saved) setResponses(JSON.parse(saved));
  }, []);
  useEffect(() => {
    localStorage.setItem('medellin_interview_survey', JSON.stringify(responses));
  }, [responses]);

  const update = (id, value) => setResponses(r => ({ ...r, [id]: value }));

  const toggle = (id) => setExpanded(e => ({ ...e, [id]: !e[id] }));

  // Backup
  const backup = () => {
    const blob = new Blob([JSON.stringify(responses, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'medellin-survey-backup.json';
    a.click();
  };

  // Submit
  const submit = async () => {
    if (!responses.name || !responses.position) {
      alert("Please provide your Name and Position before submitting.");
      return;
    }
    setIsSubmitting(true);
    const payload = {
      ...responses,
      submittedAt: new Date().toISOString(),
      userAgent: navigator.userAgent
    };
    try {
      const res = await fetch("https://formspree.io/f/mdkzbddk", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          subject: `Medellin Interview Survey Response: ${responses.name}`,
          message: JSON.stringify(payload, null, 2),
          _replyto: 'survey@dmoinsightslab.com'
        })
      });
      if (res.ok) {
        setIsSubmitted(true);
        localStorage.removeItem('medellin_interview_survey');
      } else throw new Error("Formspree error");
    } catch {
      alert("There was an issue submitting. Please use Save Backup Copy and email your file to survey@dmoinsightslab.com");
    }
    setIsSubmitting(false);
  };

  if (isSubmitted) {
    return (
      <div className="min-h-screen flex items-center justify-center bg-gradient-to-br from-green-50 to-blue-50">
        <div className="bg-white shadow-xl rounded-xl max-w-xl w-full p-8 text-center">
          <div className="text-6xl mb-6">✅</div>
          <h1 className="text-2xl font-bold mb-3">Thank you!</h1>
          <p className="mb-4 text-gray-700">Your survey response has been submitted.</p>
          <div className="mt-6 text-sm text-gray-500">Contact: survey@dmoinsightslab.com</div>
        </div>
      </div>
    );
  }

  return (
    <div className="min-h-screen bg-gray-50 py-10">
      <div className="max-w-3xl mx-auto px-2">
        {/* Header */}
        <div className="bg-white rounded-lg shadow-lg p-8 mb-6 text-center">
          <h1 className="text-3xl font-bold text-gray-800 mb-2">Medellín DMO & Convention Center</h1>
          <h2 className="text-xl text-blue-600 mb-4 font-semibold">Phase 0 Interview Discovery Canvas</h2>
          <div className="bg-blue-50 border border-blue-200 rounded-lg p-4 mx-auto mb-1 max-w-lg text-sm">
            <p>
              Please complete this form before your interview. Only your Name and Position are required.<br />
              <span className="text-blue-600 font-medium">All other questions are optional.</span>
            </p>
          </div>
        </div>

        {/* Canvas 1 */}
        <div className="bg-white rounded-lg shadow-lg mb-4">
          <div className="section-header bg-green-50 border-l-4 border-green-500 p-4"
            onClick={() => toggle('canvas1')}>
            <div className="flex justify-between items-center">
              <div className="flex items-center space-x-3">
                <span className="text-2xl">👤</span>
                <h2 className="text-xl font-semibold text-gray-800">CANVAS 1 – BASIC PROFILE</h2>
              </div>
              <span className="text-gray-500">{expanded.canvas1 ? "▼" : "▶"}</span>
            </div>
          </div>
          {expanded.canvas1 && (
            <div className="p-6 space-y-4">
              <div>
                <label className="block text-sm font-medium mb-1">Name <span className="text-red-500">*</span></label>
                <input className="w-full px-3 py-2 border border-gray-300 rounded-md"
                  value={responses.name||""} onChange={e=>update("name",e.target.value)} required />
              </div>
              <div>
                <label className="block text-sm font-medium mb-1">Position <span className="text-red-500">*</span></label>
                <input className="w-full px-3 py-2 border border-gray-300 rounded-md"
                  value={responses.position||""} onChange={e=>update("position",e.target.value)} required />
              </div>
              <div>
                <label className="block text-sm font-medium mb-1">
                  Please describe your area of responsibility within the organization.
                </label>
                <textarea className="w-full px-3 py-2 border border-gray-300 rounded-md"
                  value={responses.responsibility||""} onChange={e=>update("responsibility",e.target.value)} />
              </div>
              <div>
                <label className="block text-sm font-medium mb-1">
                  Who do you report to? What teams or departments do you work most closely with?
                </label>
                <textarea className="w-full px-3 py-2 border border-gray-300 rounded-md"
                  value={responses.reports_to||""} onChange={e=>update("reports_to",e.target.value)} />
              </div>
            </div>
          )}
        </div>

        {/* Canvas 2 */}
        <div className="bg-white rounded-lg shadow-lg mb-4">
          <div className="section-header bg-blue-50 border-l-4 border-blue-500 p-4"
            onClick={() => toggle('canvas2')}>
            <div className="flex justify-between items-center">
              <div className="flex items-center space-x-3">
                <span className="text-2xl">🎯</span>
                <h2 className="text-xl font-semibold text-gray-800">CANVAS 2 – ORGANIZATIONAL GOALS</h2>
              </div>
              <span className="text-gray-500">{expanded.canvas2 ? "▼" : "▶"}</span>
            </div>
          </div>
          {expanded.canvas2 && (
            <div className="p-6 space-y-4">
              <div>
                <label className="block text-sm font-medium mb-1">
                  What are the top 3 business goals for your organization in the next 12-18 months?
                </label>
                <textarea className="w-full px-3 py-2 border border-gray-300 rounded-md"
                  value={responses.goals||""} onChange={e=>update("goals",e.target.value)} />
              </div>
              <div>
                <label className="block text-sm font-medium mb-1">
                  What are the main KPIs or metrics your leadership uses to measure progress?
                </label>
                <textarea className="w-full px-3 py-2 border border-gray-300 rounded-md"
                  value={responses.kpis||""} onChange={e=>update("kpis",e.target.value)} />
              </div>
            </div>
          )}
        </div>

        {/* Canvas 3 */}
        <div className="bg-white rounded-lg shadow-lg mb-4">
          <div className="section-header bg-yellow-50 border-l-4 border-yellow-500 p-4"
            onClick={() => toggle('canvas3')}>
            <div className="flex justify-between items-center">
              <div className="flex items-center space-x-3">
                <span className="text-2xl">🧩</span>
                <h2 className="text-xl font-semibold text-gray-800">CANVAS 3 – DATA & INFORMATION USE CASES</h2>
              </div>
              <span className="text-gray-500">{expanded.canvas3 ? "▼" : "▶"}</span>
            </div>
          </div>
          {expanded.canvas3 && (
            <div className="p-6 space-y-4">
              <div>
                <label className="block text-sm font-medium mb-1">
                  In your own words, how is data currently used to support your work and decisions?
                </label>
                <textarea className="w-full px-3 py-2 border border-gray-300 rounded-md"
                  value={responses.data_use||""} onChange={e=>update("data_use",e.target.value)} />
              </div>
              <div>
                <label className="block text-sm font-medium mb-1">
                  Are there key reports or dashboards you rely on? Please describe.
                </label>
                <textarea className="w-full px-3 py-2 border border-gray-300 rounded-md"
                  value={responses.reports_dashboards||""} onChange={e=>update("reports_dashboards",e.target.value)} />
              </div>
              <div>
                <label className="block text-sm font-medium mb-1">
                  What data or information do you wish you had but can’t get today?
                </label>
                <textarea className="w-full px-3 py-2 border border-gray-300 rounded-md"
                  value={responses.data_wish||""} onChange={e=>update("data_wish",e.target.value)} />
              </div>
            </div>
          )}
        </div>

        {/* Canvas 4 */}
        <div className="bg-white rounded-lg shadow-lg mb-4">
          <div className="section-header bg-cyan-50 border-l-4 border-cyan-500 p-4"
            onClick={() => toggle('canvas4')}>
            <div className="flex justify-between items-center">
              <div className="flex items-center space-x-3">
                <span className="text-2xl">🔗</span>
                <h2 className="text-xl font-semibold text-gray-800">CANVAS 4 – DATA SYSTEMS & PROCESSES</h2>
              </div>
              <span className="text-gray-500">{expanded.canvas4 ? "▼" : "▶"}</span>
            </div>
          </div>
          {expanded.canvas4 && (
            <div className="p-6 space-y-4">
              <div>
                <label className="block text-sm font-medium mb-1">
                  What technology systems or tools do you use for storing or analyzing data (e.g. CRM, spreadsheets, event management, finance, marketing tools)?
                </label>
                <textarea className="w-full px-3 py-2 border border-gray-300 rounded-md"
                  value={responses.systems||""} onChange={e=>update("systems",e.target.value)} />
              </div>
              <div>
                <label className="block text-sm font-medium mb-1">
                  How are data/reports collected, stored, and shared in your department?
                </label>
                <textarea className="w-full px-3 py-2 border border-gray-300 rounded-md"
                  value={responses.data_sharing||""} onChange={e=>update("data_sharing",e.target.value)} />
              </div>
              <div>
                <label className="block text-sm font-medium mb-1">
                  What are the biggest pain points or challenges you experience with current data systems or processes?
                </label>
                <textarea className="w-full px-3 py-2 border border-gray-300 rounded-md"
                  value={responses.system_pain||""} onChange={e=>update("system_pain",e.target.value)} />
              </div>
            </div>
          )}
        </div>

        {/* Canvas 5 */}
        <div className="bg-white rounded-lg shadow-lg mb-4">
          <div className="section-header bg-fuchsia-50 border-l-4 border-fuchsia-500 p-4"
            onClick={() => toggle('canvas5')}>
            <div className="flex justify-between items-center">
              <div className="flex items-center space-x-3">
                <span className="text-2xl">📈</span>
                <h2 className="text-xl font-semibold text-gray-800">CANVAS 5 – DATA SKILLS & CULTURE</h2>
              </div>
              <span className="text-gray-500">{expanded.canvas5 ? "▼" : "▶"}</span>
            </div>
          </div>
          {expanded.canvas5 && (
            <div className="p-6 space-y-4">
              <div>
                <label className="block text-sm font-medium mb-1">
                  How comfortable are you and your team working with data (e.g., finding, interpreting, making decisions)?
                </label>
                <textarea className="w-full px-3 py-2 border border-gray-300 rounded-md"
                  value={responses.data_skill||""} onChange={e=>update("data_skill",e.target.value)} />
              </div>
              <div>
                <label className="block text-sm font-medium mb-1">
                  What training, resources, or support would help increase data confidence or skills in your role?
                </label>
                <textarea className="w-full px-3 py-2 border border-gray-300 rounded-md"
                  value={responses.data_training||""} onChange={e=>update("data_training",e.target.value)} />
              </div>
            </div>
          )}
        </div>

        {/* Canvas 6 */}
        <div className="bg-white rounded-lg shadow-lg mb-4">
          <div className="section-header bg-rose-50 border-l-4 border-rose-500 p-4"
            onClick={() => toggle('canvas6')}>
            <div className="flex justify-between items-center">
              <div className="flex items-center space-x-3">
                <span className="text-2xl">🤝</span>
                <h2 className="text-xl font-semibold text-gray-800">CANVAS 6 – DECISION-MAKING & CHANGE</h2>
              </div>
              <span className="text-gray-500">{expanded.canvas6 ? "▼" : "▶"}</span>
            </div>
          </div>
          {expanded.canvas6 && (
            <div className="p-6 space-y-4">
              <div>
                <label className="block text-sm font-medium mb-1">
                  How are important decisions made in your organization (data, experience, consensus, other)?
                </label>
                <textarea className="w-full px-3 py-2 border border-gray-300 rounded-md"
                  value={responses.decision||""} onChange={e=>update("decision",e.target.value)} />
              </div>
              <div>
                <label className="block text-sm font-medium mb-1">
                  What would help your team/organization become more data-driven in the future?
                </label>
                <textarea className="w-full px-3 py-2 border border-gray-300 rounded-md"
                  value={responses.data_driven||""} onChange={e=>update("data_driven",e.target.value)} />
              </div>
            </div>
          )}
        </div>

        {/* Canvas 7 */}
        <div className="bg-white rounded-lg shadow-lg mb-4">
          <div className="section-header bg-amber-50 border-l-4 border-amber-500 p-4"
            onClick={() => toggle('canvas7')}>
            <div className="flex justify-between items-center">
              <div className="flex items-center space-x-3">
                <span className="text-2xl">💡</span>
                <h2 className="text-xl font-semibold text-gray-800">CANVAS 7 – ADDITIONAL COMMENTS & SUGGESTIONS</h2>
              </div>
              <span className="text-gray-500">{expanded.canvas7 ? "▼" : "▶"}</span>
            </div>
          </div>
          {expanded.canvas7 && (
            <div className="p-6 space-y-4">
              <div>
                <label className="block text-sm font-medium mb-1">
                  Anything else you would like to share about data, reporting, or analytics needs?
                </label>
                <textarea className="w-full px-3 py-2 border border-gray-300 rounded-md"
                  value={responses.final_comments||""} onChange={e=>update("final_comments",e.target.value)} />
              </div>
            </div>
          )}
        </div>

        {/* Controls */}
        <div className="bg-gradient-to-r from-blue-50 to-green-50 border border-blue-200 rounded-lg p-6 mt-8">
          <div className="text-center mb-6">
            <div className="text-6xl mb-2">🎯</div>
            <h3 className="text-xl font-semibold text-gray-800 mb-2">Ready to Submit?</h3>
            <p className="text-gray-600 mb-2">
              You may save a backup of your answers or submit directly. Name and Position are required.
            </p>
          </div>
          <div className="flex flex-col sm:flex-row gap-4 justify-center">
            <button onClick={backup}
              className="flex items-center justify-center space-x-2 bg-gray-100 hover:bg-gray-200 text-gray-700 px-6 py-3 rounded-lg transition-colors">
              <span className="text-xl">💾</span><span>Save Backup Copy</span>
            </button>
            <button onClick={submit} disabled={isSubmitting || !responses.name || !responses.position}
              className="flex items-center justify-center space-x-2 bg-blue-600 hover:bg-blue-700 disabled:bg-gray-400 text-white px-8 py-3 rounded-lg transition-colors font-medium">
              <span className="text-xl">📧</span><span>{isSubmitting ? 'Submitting...' : 'Submit Survey'}</span>
            </button>
          </div>
          <p className="text-xs text-gray-500 mt-4 text-center">
            Your responses are automatically saved as you type. This survey is confidential and will only be used to improve Medellín's data capabilities.
          </p>
        </div>
      </div>
    </div>
  );
}

ReactDOM.render(<MedellinSurvey />, document.getElementById('root'));
</script>
</body>
</html>
