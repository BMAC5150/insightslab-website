<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Medellin DMO Phase 0 Discovery Interview Questionnaire</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    .section-header { cursor: pointer; transition: all 0.3s ease; }
    .section-header:hover { background-color: #f3f4f6; }
    textarea { min-height: 60px; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">

const { useState, useEffect } = React;

function MedellinSurvey() {
  const [expanded, setExpanded] = useState({
    s1: true, s2: false, s3: false, s4: false, s5: false
  });
  const [responses, setResponses] = useState({});
  const [isSubmitting, setIsSubmitting] = useState(false);
  const [isSubmitted, setIsSubmitted] = useState(false);

  // Autosave/load
  useEffect(() => {
    const saved = localStorage.getItem('medellin_phase0_survey');
    if (saved) setResponses(JSON.parse(saved));
  }, []);
  useEffect(() => {
    localStorage.setItem('medellin_phase0_survey', JSON.stringify(responses));
  }, [responses]);
  const update = (id, value) => setResponses(r => ({ ...r, [id]: value }));
  const toggle = (id) => setExpanded(e => ({ ...e, [id]: !e[id] }));

  // Backup
  const backup = () => {
    const blob = new Blob([JSON.stringify(responses, null, 2)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'medellin-phase0-backup.json';
    a.click();
  };

  // Submit
  const submit = async () => {
    if (!responses.interviewee || !responses.date) {
  alert("Please provide Executive Leader and Date.");
  return;
}
    setIsSubmitting(true);
    const payload = {
      ...responses,
      submittedAt: new Date().toISOString(),
      userAgent: navigator.userAgent
    };
    try {
      const res = await fetch("https://formspree.io/f/mdkzbddk", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          subject: `Medellin Phase 0 Interview Response: ${responses.interviewee}`,
          message: JSON.stringify(payload, null, 2),
          _replyto: 'survey@dmoinsightslab.com'
        })
      });
      if (res.ok) {
        setIsSubmitted(true);
        localStorage.removeItem('medellin_phase0_survey');
      } else throw new Error("Formspree error");
    } catch {
      alert("There was an issue submitting. Please use Save Backup Copy and email your file to survey@dmoinsightslab.com");
    }
    setIsSubmitting(false);
  };

  if (isSubmitted) {
    return (
      <div className="min-h-screen flex items-center justify-center bg-gradient-to-br from-green-50 to-blue-50">
        <div className="bg-white shadow-xl rounded-xl max-w-xl w-full p-8 text-center">
          <div className="text-6xl mb-6">✅</div>
          <h1 className="text-2xl font-bold mb-3">Thank you!</h1>
          <p className="mb-4 text-gray-700">Your survey response has been submitted.</p>
          <div className="mt-6 text-sm text-gray-500">Contact: survey@dmoinsightslab.com</div>
        </div>
      </div>
    );
  }

  return (
    <div className="min-h-screen bg-gray-50 py-10">
      <div className="max-w-3xl mx-auto px-2">
        {/* Header */}
        <div className="bg-white rounded-lg shadow-lg p-8 mb-6 text-center">
          <h1 className="text-3xl font-bold text-gray-800 mb-2">Medellín DMO</h1>
          <h2 className="text-xl text-blue-600 mb-4 font-semibold">Phase 0 Discovery Interview Questionnaire</h2>
          <div className="bg-blue-50 border border-blue-200 rounded-lg p-4 mx-auto mb-1 max-w-lg text-sm">
            <p>
              Please complete this form before your interview. <br/>
              <span className="text-blue-600 font-medium">Executive Leader and Date are required.</span>
            </p>
          </div>
        </div>

        {/* Interviewer / Date */}
        <div className="bg-white rounded-lg shadow p-6 mb-6">
          <div className="grid md:grid-cols-3 gap-4">
            <div>
              <label className="block text-sm font-medium mb-1">Executive Leader (Name/Title) <span className="text-red-500">*</span></label>
              <input className="w-full px-3 py-2 border border-gray-300 rounded-md"
                value={responses.interviewee||""} onChange={e=>update("interviewee",e.target.value)} required />
            </div>
            <div>
              <label className="block text-sm font-medium mb-1">Date <span className="text-red-500">*</span></label>
              <input type="date" className="w-full px-3 py-2 border border-gray-300 rounded-md"
                value={responses.date||""} onChange={e=>update("date",e.target.value)} required />
            </div>
          </div>
        </div>

        {/* SECTION 1 */}
        <div className="bg-white rounded-lg shadow-lg mb-4">
          <div className="section-header bg-green-50 border-l-4 border-green-500 p-4"
            onClick={() => toggle('s1')}>
            <div className="flex justify-between items-center">
              <div className="flex items-center space-x-3">
                <span className="text-2xl">📊</span>
                <h2 className="text-xl font-semibold text-gray-800">Critical Data Sources & Reports</h2>
              </div>
              <span className="text-gray-500">{expanded.s1 ? "▼" : "▶"}</span>
            </div>
          </div>
          {expanded.s1 && (
            <div className="p-6 space-y-4">
              <label className="block text-sm font-medium mb-2">
                What are the most critical data sources and reports you rely on for your day-to-day decisions?
              </label>
              <div className="text-xs text-gray-600 mb-2">
                <div><b>FOR YOUR CONSIDERATION:</b></div>
                <div><b>DMO Leader:</b> Strategic KPIs, board/municipal reports</div>
                <div><b>IT Leader:</b> Core systems, data repositories, integrations</div>
                <div><b>Sales and Marketing Leader:</b> Campaign data, visitor stats, attribution models</div>
                <div><b>Operations Leader:</b> Operational metrics, workflow/process data</div>
              </div>
              <textarea className="w-full px-3 py-2 border border-gray-300 rounded-md"
                value={responses.data_sources||""} onChange={e=>update("data_sources",e.target.value)} />
              <label className="block text-sm font-medium mb-1 mt-4">Notes:</label>
              <textarea className="w-full px-3 py-2 border border-gray-300 rounded-md"
                value={responses.data_sources_notes||""} onChange={e=>update("data_sources_notes",e.target.value)} />
            </div>
          )}
        </div>

        {/* SECTION 2 */}
        <div className="bg-white rounded-lg shadow-lg mb-4">
          <div className="section-header bg-blue-50 border-l-4 border-blue-500 p-4"
            onClick={() => toggle('s2')}>
            <div className="flex justify-between items-center">
              <div className="flex items-center space-x-3">
                <span className="text-2xl">💾</span>
                <h2 className="text-xl font-semibold text-gray-800">Data Collection, Storage & Sharing</h2>
              </div>
              <span className="text-gray-500">{expanded.s2 ? "▼" : "▶"}</span>
            </div>
          </div>
          {expanded.s2 && (
            <div className="p-6 space-y-4">
              <label className="block text-sm font-medium mb-2">
                How is data currently collected, stored, accessed, and shared within your team and across the organization?
              </label>
              <div className="text-xs text-gray-600 mb-2">
                <div><b>FOR YOUR CONSIDERATION:</b></div>
                <div><b>DMO Leader:</b> Inter-department and stakeholder data sharing</div>
                <div><b>IT Leader:</b> Technical platforms, security, silo issues</div>
                <div><b>Sales and Marketing Leader:</b> Data for marketing/reporting, integration with other teams</div>
                <div><b>Operations Leader:</b> Data sharing across operations, front-line teams</div>
              </div>
              <textarea className="w-full px-3 py-2 border border-gray-300 rounded-md"
                value={responses.data_collection||""} onChange={e=>update("data_collection",e.target.value)} />
              <label className="block text-sm font-medium mb-1 mt-4">Notes:</label>
              <textarea className="w-full px-3 py-2 border border-gray-300 rounded-md"
                value={responses.data_collection_notes||""} onChange={e=>update("data_collection_notes",e.target.value)} />
            </div>
          )}
        </div>

        {/* SECTION 3 */}
        <div className="bg-white rounded-lg shadow-lg mb-4">
          <div className="section-header bg-yellow-50 border-l-4 border-yellow-500 p-4"
            onClick={() => toggle('s3')}>
            <div className="flex justify-between items-center">
              <div className="flex items-center space-x-3">
                <span className="text-2xl">⚠️</span>
                <h2 className="text-xl font-semibold text-gray-800">Data Challenges & Pain Points</h2>
              </div>
              <span className="text-gray-500">{expanded.s3 ? "▼" : "▶"}</span>
            </div>
          </div>
          {expanded.s3 && (
            <div className="p-6 space-y-4">
              <label className="block text-sm font-medium mb-2">
                What are your main challenges or pain points with the current data ecosystem (e.g., quality, availability, timeliness, relevance)?
              </label>
              <span className="text-xs text-gray-600 mb-2">
                Consider frustrations, workarounds, missing tools or insights
              </span>
              <textarea className="w-full px-3 py-2 border border-gray-300 rounded-md"
                value={responses.data_challenges||""} onChange={e=>update("data_challenges",e.target.value)} />
              <label className="block text-sm font-medium mb-1 mt-4">Notes:</label>
              <textarea className="w-full px-3 py-2 border border-gray-300 rounded-md"
                value={responses.data_challenges_notes||""} onChange={e=>update("data_challenges_notes",e.target.value)} />
            </div>
          )}
        </div>

        {/* SECTION 4 */}
        <div className="bg-white rounded-lg shadow-lg mb-4">
          <div className="section-header bg-cyan-50 border-l-4 border-cyan-500 p-4"
            onClick={() => toggle('s4')}>
            <div className="flex justify-between items-center">
              <div className="flex items-center space-x-3">
                <span className="text-2xl">🔗</span>
                <h2 className="text-xl font-semibold text-gray-800">Collaboration & Data Sharing</h2>
              </div>
              <span className="text-gray-500">{expanded.s4 ? "▼" : "▶"}</span>
            </div>
          </div>
          {expanded.s4 && (
            <div className="p-6 space-y-4">
              <label className="block text-sm font-medium mb-2">
                How do you currently collaborate or share data with other departments or external stakeholders (e.g., government, private sector, partners)?
              </label>
              <div className="text-xs text-gray-600 mb-2">
                <div><b>FOR YOUR CONSIDERATION:</b></div>
                <div><b>DMO Leader:</b> Transparency, compliance, stakeholder alignment</div>
                <div><b>IT Leader:</b> Technical integrations, APIs, agreements</div>
                <div><b>Sales and Marketing Leader:</b> Campaign and external data partnerships</div>
                <div><b>Operations Leader:</b> Data flow between operations and other entities</div>
              </div>
              <textarea className="w-full px-3 py-2 border border-gray-300 rounded-md"
                value={responses.collaboration||""} onChange={e=>update("collaboration",e.target.value)} />
              <label className="block text-sm font-medium mb-1 mt-4">Notes:</label>
              <textarea className="w-full px-3 py-2 border border-gray-300 rounded-md"
                value={responses.collaboration_notes||""} onChange={e=>update("collaboration_notes",e.target.value)} />
            </div>
          )}
        </div>

        {/* SECTION 5 */}
        <div className="bg-white rounded-lg shadow-lg mb-4">
          <div className="section-header bg-fuchsia-50 border-l-4 border-fuchsia-500 p-4"
            onClick={() => toggle('s5')}>
            <div className="flex justify-between items-center">
              <div className="flex items-center space-x-3">
                <span className="text-2xl">🚀</span>
                <h2 className="text-xl font-semibold text-gray-800">Priority Data Improvements</h2>
              </div>
              <span className="text-gray-500">{expanded.s5 ? "▼" : "▶"}</span>
            </div>
          </div>
          {expanded.s5 && (
            <div className="p-6 space-y-4">
              <label className="block text-sm font-medium mb-2">
                If you could improve or automate any single aspect of your data management or reporting in the next year, what would it be—and why?
              </label>
              <span className="text-xs text-gray-600 mb-2">
                What would be a “quick win” or high-impact wishlist for your area
              </span>
              <textarea className="w-full px-3 py-2 border border-gray-300 rounded-md"
                value={responses.improvements||""} onChange={e=>update("improvements",e.target.value)} />
              <label className="block text-sm font-medium mb-1 mt-4">Notes:</label>
              <textarea className="w-full px-3 py-2 border border-gray-300 rounded-md"
                value={responses.improvements_notes||""} onChange={e=>update("improvements_notes",e.target.value)} />
            </div>
          )}
        </div>

        {/* Controls */}
        <div className="bg-gradient-to-r from-blue-50 to-green-50 border border-blue-200 rounded-lg p-6 mt-8">
          <div className="text-center mb-6">
            <div className="text-6xl mb-2">🎯</div>
            <h3 className="text-xl font-semibold text-gray-800 mb-2">Ready to Submit?</h3>
            <p className="text-gray-600 mb-2">
              You may save a backup of your answers or submit directly. Interviewer, Interviewee, and Date are required.
            </p>
          </div>
          <div className="flex flex-col sm:flex-row gap-4 justify-center">
            <button onClick={backup}
              className="flex items-center justify-center space-x-2 bg-gray-100 hover:bg-gray-200 text-gray-700 px-6 py-3 rounded-lg transition-colors">
              <span className="text-xl">💾</span><span>Save Backup Copy</span>
            </button>
            <button onClick={submit} disabled={isSubmitting || !responses.interviewee || !responses.date}
              className="flex items-center justify-center space-x-2 bg-blue-600 hover:bg-blue-700 disabled:bg-gray-400 text-white px-8 py-3 rounded-lg transition-colors font-medium">
              <span className="text-xl">📧</span><span>{isSubmitting ? 'Submitting...' : 'Submit Survey'}</span>
            </button>
          </div>
          <p className="text-xs text-gray-500 mt-4 text-center">
            Your responses are automatically saved as you type. This survey is confidential and will only be used to improve Medellín's data capabilities.
          </p>
        </div>
      </div>
    </div>
  );
}

ReactDOM.render(<MedellinSurvey />, document.getElementById('root'));
</script>
</body>
</html>
