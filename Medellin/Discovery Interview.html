<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medellin Convention Bureau Survey - InsightsLab</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        .section-header { cursor: pointer; transition: all 0.3s ease; }
        .section-header:hover { background-color: #f3f4f6; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function MedellinSurvey() {
            const [responses, setResponses] = useState({});
            const [expandedSections, setExpandedSections] = useState({ section0: true });
            const [isSubmitting, setIsSubmitting] = useState(false);
            const [isSubmitted, setIsSubmitted] = useState(false);
            const [saveStatus, setSaveStatus] = useState('');

            const updateResponse = (questionId, value, isMultiple = false) => {
                setResponses(prev => {
                    const newResponses = isMultiple 
                        ? (() => {
                            const currentValues = prev[questionId] || [];
                            if (currentValues.includes(value)) {
                                return { ...prev, [questionId]: currentValues.filter(v => v !== value) };
                            } else {
                                return { ...prev, [questionId]: [...currentValues, value] };
                            }
                        })()
                        : { ...prev, [questionId]: value };
                    
                    localStorage.setItem('medellin_survey_responses', JSON.stringify(newResponses));
                    setSaveStatus('Changes saved automatically');
                    setTimeout(() => setSaveStatus(''), 3000);
                    
                    return newResponses;
                });
            };

            useEffect(() => {
                const savedResponses = localStorage.getItem('medellin_survey_responses');
                if (savedResponses) {
                    setResponses(JSON.parse(savedResponses));
                    setSaveStatus('Previous responses loaded');
                    setTimeout(() => setSaveStatus(''), 3000);
                }
            }, []);

            const submitSurvey = async () => {
                if (!responses.name || !responses.position) {
                    alert('Please fill in your name and position before submitting.');
                    return;
                }

                setIsSubmitting(true);
                
                const submissionData = {
                    timestamp: new Date().toISOString(),
                    responses: responses,
                    metadata: {
                        userAgent: navigator.userAgent,
                        submittedAt: new Date().toLocaleString(),
                        responseCount: Object.keys(responses).length
                    }
                };

                try {
                    // Replace YOUR_FORM_ID with your actual Formspree form ID
                    const response = await fetch('https://formspree.io/f/mrbkqywy', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            subject: `Medellin DMO Survey Response from ${responses.name}`,
                            _replyto: 'bmac@dmoinsightslab.com',
                            // Individual fields for easier email parsing
                            respondent_name: responses.name || '',
                            respondent_position: responses.position || '',
                            responsibilities: JSON.stringify(responses.responsibilities || []),
                            responsibilities_other: responses.responsibilities_other || '',
                            // Goals and priorities
                            goal_priority_0: responses.goal_priority_0 || '',
                            goal_priority_1: responses.goal_priority_1 || '',
                            goal_priority_2: responses.goal_priority_2 || '',
                            goal_priority_3: responses.goal_priority_3 || '',
                            goal_priority_4: responses.goal_priority_4 || '',
                            goal_priority_5: responses.goal_priority_5 || '',
                            goal_priority_6: responses.goal_priority_6 || '',
                            goal_priority_7: responses.goal_priority_7 || '',
                            goal_priority_other: responses.goal_priority_other || '',
                            goal_other: responses.goal_other || '',
                            success_feeling: responses.success_feeling || '',
                            // Challenges and difficulties
                            job_difficulties: JSON.stringify(responses.job_difficulties || []),
                            job_difficulties_other: responses.job_difficulties_other || '',
                            perfect_info_clients: responses.perfect_info_clients || '',
                            perfect_info_competition: responses.perfect_info_competition || '',
                            perfect_info_performance: responses.perfect_info_performance || '',
                            perfect_info_market: responses.perfect_info_market || '',
                            // Current systems
                            systems_used: JSON.stringify(responses.systems_used || []),
                            systems_used_other: responses.systems_used_other || '',
                            info_finding_methods: JSON.stringify(responses.info_finding_methods || []),
                            info_finding_methods_other: responses.info_finding_methods_other || '',
                            // Future improvements
                            biggest_impact_problem: responses.biggest_impact_problem || '',
                            do_differently: responses.do_differently || '',
                            tech_comfort: responses.tech_comfort || '',
                            // Success measurement
                            current_success_measurement: responses.current_success_measurement || '',
                            manager_metrics: responses.manager_metrics || '',
                            impact_daily_work: responses.impact_daily_work || '',
                            impact_medellin_reputation: responses.impact_medellin_reputation || '',
                            impact_team_success: responses.impact_team_success || '',
                            // Quick wins
                            frustrating_problem_1: responses.frustrating_problem_1 || '',
                            frustrating_problem_2: responses.frustrating_problem_2 || '',
                            frustrating_problem_3: responses.frustrating_problem_3 || '',
                            simple_improvement_1: responses.simple_improvement_1 || '',
                            simple_improvement_2: responses.simple_improvement_2 || '',
                            simple_improvement_3: responses.simple_improvement_3 || '',
                            // Final questions
                            project_concerns: responses.project_concerns || '',
                            system_excitement: responses.system_excitement || '',
                            medellin_context: responses.medellin_context || '',
                            other_thoughts: responses.other_thoughts || '',
                            // Metadata
                            submitted_at: submissionData.timestamp,
                            user_agent: submissionData.metadata.userAgent,
                            response_count: submissionData.metadata.responseCount
                        })
                    });

                    if (response.ok) {
                        setIsSubmitted(true);
                        localStorage.removeItem('medellin_survey_responses');
                        window.scrollTo({ top: 0, behavior: 'smooth' });
                    } else {
                        throw new Error('Submission failed');
                    }
                } catch (error) {
                    const dataStr = JSON.stringify(submissionData, null, 2);
                    const dataBlob = new Blob([dataStr], {type: 'application/json'});
                    const url = URL.createObjectURL(dataBlob);
                    const link = document.createElement('a');
                    link.href = url;
                    link.download = `medellin-survey-${responses.name || 'response'}-${Date.now()}.json`;
                    link.click();
                    
                    alert('There was an issue with online submission. Your responses have been downloaded as a file. Please email this file to bmac@dmoinsightslab.com');
                } finally {
                    setIsSubmitting(false);
                }
            };

            const exportResponses = () => {
                const dataStr = JSON.stringify(responses, null, 2);
                const dataBlob = new Blob([dataStr], {type: 'application/json'});
                const url = URL.createObjectURL(dataBlob);
                const link = document.createElement('a');
                link.href = url;
                link.download = `medellin-survey-backup-${Date.now()}.json`;
                link.click();
            };

            const toggleSection = (sectionId) => {
                setExpandedSections(prev => ({
                    ...prev,
                    [sectionId]: !prev[sectionId]
                }));
            };

            // Handle keyboard navigation for sections
            const handleKeyPress = (e, sectionId) => {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    toggleSection(sectionId);
                }
            };

            const SectionHeader = ({ id, title, icon, isExpanded, color = "blue" }) => (
                React.createElement('div', { 
                    className: `bg-${color}-50 border-l-4 border-${color}-500 p-4 cursor-pointer hover:bg-${color}-100 transition-colors section-header`,
                    onClick: () => toggleSection(id),
                    onKeyPress: (e) => handleKeyPress(e, id),
                    role: "button",
                    tabIndex: 0,
                    'aria-expanded': isExpanded,
                    'aria-label': `Toggle ${title} section`
                },
                    React.createElement('div', { className: "flex items-center justify-between" },
                        React.createElement('div', { className: "flex items-center space-x-3" },
                            React.createElement('span', { className: "text-2xl", 'aria-hidden': "true" }, icon),
                            React.createElement('h2', { className: "text-xl font-semibold text-gray-800" }, title)
                        ),
                        React.createElement('span', { className: "text-gray-600", 'aria-hidden': "true" }, isExpanded ? '▼' : '▶')
                    )
                )
            );

            const CheckboxGroup = ({ questionId, options, allowOther = false, otherLabel = "Other" }) => (
                React.createElement('div', { className: "space-y-2" },
                    options.map((option, index) =>
                        React.createElement('label', { key: index, className: "flex items-start space-x-3 p-2 hover:bg-gray-50 rounded" },
                            React.createElement('input', {
                                type: 'checkbox',
                                className: 'mt-1 h-4 w-4 text-blue-600 rounded border-gray-300',
                                checked: (responses[questionId] || []).includes(option),
                                onChange: () => updateResponse(questionId, option, true)
                            }),
                            React.createElement('span', { className: "text-gray-700" }, option)
                        )
                    ),
                    allowOther && React.createElement('div', { className: "flex items-center space-x-3 p-2" },
                        React.createElement('input', {
                            type: 'checkbox',
                            className: 'mt-1 h-4 w-4 text-blue-600 rounded border-gray-300',
                            checked: responses[`${questionId}_other_checked`] || false,
                            onChange: () => updateResponse(`${questionId}_other_checked`, !responses[`${questionId}_other_checked`])
                        }),
                        React.createElement('div', { className: "flex-1 flex items-center space-x-2" },
                            React.createElement('span', { className: "text-gray-700" }, `${otherLabel}:`),
                            React.createElement('input', {
                                type: 'text',
                                className: 'flex-1 px-3 py-1 border border-gray-300 rounded-md text-sm',
                                placeholder: 'Please specify...',
                                value: responses[`${questionId}_other`] || '',
                                onChange: (e) => updateResponse(`${questionId}_other`, e.target.value)
                            })
                        )
                    )
                )
            );

            const TextArea = ({ questionId, placeholder = "Please share your thoughts...", rows = 3 }) => (
                React.createElement('textarea', {
                    className: 'w-full px-3 py-2 border border-gray-300 rounded-md resize-none focus:ring-2 focus:ring-blue-500 focus:border-transparent',
                    rows: rows,
                    placeholder: placeholder,
                    value: responses[questionId] || '',
                    onChange: (e) => updateResponse(questionId, e.target.value)
                })
            );

            const RadioGroup = ({ questionId, options }) => (
                React.createElement('div', { className: "space-y-2" },
                    options.map((option, index) =>
                        React.createElement('label', { key: index, className: "flex items-center space-x-3 p-2 hover:bg-gray-50 rounded" },
                            React.createElement('input', {
                                type: 'radio',
                                name: questionId,
                                className: 'h-4 w-4 text-blue-600 border-gray-300',
                                checked: responses[questionId] === option,
                                onChange: () => updateResponse(questionId, option)
                            }),
                            React.createElement('span', { className: "text-gray-700" }, option)
                        )
                    )
                )
            );

            if (isSubmitted) {
                return React.createElement('div', {
                    className: "min-h-screen bg-gradient-to-br from-green-50 to-blue-50 flex items-center justify-center py-8"
                }, 
                    React.createElement('div', { className: "max-w-2xl mx-auto px-4" },
                        React.createElement('div', { className: "bg-white rounded-lg shadow-xl p-8 text-center" },
                            React.createElement('div', { className: "text-6xl mb-6" }, '✅'),
                            React.createElement('h1', { className: "text-3xl font-bold text-gray-800 mb-4" }, '¡Gracias! Thank You!'),
                            React.createElement('div', { className: "space-y-4 text-gray-600" },
                                React.createElement('p', { className: "text-lg" }, 'Your survey response has been submitted successfully.'),
                                React.createElement('p', {}, 'Su respuesta a la encuesta ha sido enviada exitosamente.'),
                                React.createElement('div', { className: "bg-blue-50 border border-blue-200 rounded-lg p-4 mt-6" },
                                    React.createElement('h3', { className: "font-semibold text-blue-800 mb-2" }, 'Next Steps / Próximos Pasos:'),
                                    React.createElement('ul', { className: "text-sm text-blue-700 space-y-1" },
                                        React.createElement('li', {}, '• We\'ll review your responses within 2 business days'),
                                        React.createElement('li', {}, '• Our team will contact you to schedule a follow-up interview'),
                                        React.createElement('li', {}, '• Revisaremos sus respuestas en 2 días hábiles'),
                                        React.createElement('li', {}, '• Nuestro equipo se pondrá en contacto para programar una entrevista')
                                    )
                                ),
                                React.createElement('p', { className: "text-sm text-gray-500 mt-6" }, 
                                    `Contact: bmac@dmoinsightslab.com\nReference ID: ${Date.now()}`
                                )
                            )
                        )
                    )
                );
            }

            return React.createElement('div', { className: "min-h-screen bg-gray-50 py-8" },
                React.createElement('div', { className: "max-w-4xl mx-auto px-4" },
                    // Header
                    React.createElement('div', { className: "bg-white rounded-lg shadow-lg p-8 mb-6" },
                        React.createElement('div', { className: "text-center" },
                            React.createElement('h1', { className: "text-3xl font-bold text-gray-800 mb-4" }, 'Medellin Convention Bureau'),
                            React.createElement('h2', { className: "text-xl text-blue-600 mb-4" }, 'Business Goals & Information Needs'),
                            React.createElement('div', { className: "bg-blue-50 border border-blue-200 rounded-lg p-4 max-w-2xl mx-auto" },
                                React.createElement('p', { className: "text-gray-700 text-sm" },
                                    'We want to understand your work better so we can help you succeed. This is not a test - we just want to know what\'s important to you and what information would make your job easier.'
                                ),
                                React.createElement('p', { className: "text-blue-600 font-medium mt-2" }, 'Time needed: 10-15 minutes')
                            )
                        )
                    ),

                    // Personal Info Section
                    React.createElement('div', { className: "bg-white rounded-lg shadow-lg mb-4" },
                        React.createElement(SectionHeader, { 
                            id: 'section0', 
                            title: 'Your Role & Responsibilities', 
                            icon: '👤', 
                            isExpanded: expandedSections.section0,
                            color: 'green'
                        }),
                        expandedSections.section0 && React.createElement('div', { className: "p-6 space-y-6" },
                            React.createElement('div', { className: "grid grid-cols-1 md:grid-cols-2 gap-4" },
                                React.createElement('div', {},
                                    React.createElement('label', { className: "block text-sm font-medium text-gray-700 mb-2" }, 'Name'),
                                    React.createElement('input', {
                                        type: 'text',
                                        className: 'w-full px-3 py-2 border border-gray-300 rounded-md',
                                        value: responses.name || '',
                                        onChange: (e) => updateResponse('name', e.target.value)
                                    })
                                ),
                                React.createElement('div', {},
                                    React.createElement('label', { className: "block text-sm font-medium text-gray-700 mb-2" }, 'Position'),
                                    React.createElement('input', {
                                        type: 'text',
                                        className: 'w-full px-3 py-2 border border-gray-300 rounded-md',
                                        value: responses.position || '',
                                        onChange: (e) => updateResponse('position', e.target.value)
                                    })
                                )
                            ),
                            React.createElement('div', {},
                                React.createElement('label', { className: "block text-sm font-medium text-gray-700 mb-3" },
                                    'What are your main responsibilities? (Check all that apply)'
                                ),
                                React.createElement(CheckboxGroup, {
                                    questionId: 'responsibilities',
                                    options: [
                                        "Attracting new events to Medellin",
                                        "Working with event organizers during planning",
                                        "Marketing Medellin as a destination",
                                        "Managing relationships with hotels/venues",
                                        "Financial planning and budgets",
                                        "Operations and logistics"
                                    ],
                                    allowOther: true
                                })
                            )
                        )
                    ),

                    // Part 1: Success Goals
                    React.createElement('div', { className: "bg-white rounded-lg shadow-lg mb-4" },
                        React.createElement(SectionHeader, { 
                            id: 'section1', 
                            title: 'Part 1: What Success Looks Like', 
                            icon: '🎯', 
                            isExpanded: expandedSections.section1,
                            color: 'purple'
                        }),
                        expandedSections.section1 && React.createElement('div', { className: "p-6 space-y-6" },
                            React.createElement('div', {},
                                React.createElement('label', { className: "block text-sm font-medium text-gray-700 mb-3" },
                                    'What are the most important goals for your work? ',
                                    React.createElement('span', { className: "text-blue-600 font-medium block" }, 'Pick your TOP 3 and mark them 1, 2, 3 (1 = most important)')
                                ),
                                React.createElement('div', { className: "space-y-3" },
                                    [
                                        "Bring more events to Medellin each year",
                                        "Attract bigger, more important events",
                                        "Make more money/revenue from events",
                                        "Beat our competitor cities (Bogotá, Cartagena, etc.)",
                                        "Make our existing clients happy",
                                        "Work more efficiently with less effort",
                                        "Show the city government we're successful",
                                        "Build Medellin's reputation internationally"
                                    ].map((goal, index) =>
                                        React.createElement('div', { key: index, className: "flex items-center space-x-3 p-3 border border-gray-200 rounded hover:bg-gray-50" },
                                            React.createElement('select', { 
                                                className: 'w-16 px-2 py-1 border border-gray-300 rounded text-sm',
                                                value: responses[`goal_priority_${index}`] || '',
                                                onChange: (e) => updateResponse(`goal_priority_${index}`, e.target.value)
                                            },
                                                React.createElement('option', { value: '' }, '-'),
                                                React.createElement('option', { value: '1' }, '1'),
                                                React.createElement('option', { value: '2' }, '2'),
                                                React.createElement('option', { value: '3' }, '3')
                                            ),
                                            React.createElement('span', { className: "text-gray-700" }, goal)
                                        )
                                    ),
                                    React.createElement('div', { className: "flex items-center space-x-3 p-3 border border-gray-200 rounded" },
                                        React.createElement('select', { 
                                            className: 'w-16 px-2 py-1 border border-gray-300 rounded text-sm',
                                            value: responses.goal_priority_other || '',
                                            onChange: (e) => updateResponse('goal_priority_other', e.target.value)
                                        },
                                            React.createElement('option', { value: '' }, '-'),
                                            React.createElement('option', { value: '1' }, '1'),
                                            React.createElement('option', { value: '2' }, '2'),
                                            React.createElement('option', { value: '3' }, '3')
                                        ),
                                        React.createElement('input', {
                                            type: 'text',
                                            className: 'flex-1 px-3 py-1 border border-gray-300 rounded-md text-sm',
                                            placeholder: 'Other goal...',
                                            value: responses.goal_other || '',
                                            onChange: (e) => updateResponse('goal_other', e.target.value)
                                        })
                                    )
                                )
                            ),
                            React.createElement('div', {},
                                React.createElement('label', { className: "block text-sm font-medium text-gray-700 mb-2" },
                                    'What would make you feel most successful this year?'
                                ),
                                React.createElement(TextArea, { questionId: 'success_feeling', placeholder: 'Describe what success looks like for you...' })
                            )
                        )
                    ),

                    // Part 2: Daily Challenges
                    React.createElement('div', { className: "bg-white rounded-lg shadow-lg mb-4" },
                        React.createElement(SectionHeader, { 
                            id: 'section2', 
                            title: 'Part 2: Daily Challenges & Information Needs', 
                            icon: '⚠️', 
                            isExpanded: expandedSections.section2,
                            color: 'red'
                        }),
                        expandedSections.section2 && React.createElement('div', { className: "p-6 space-y-6" },
                            React.createElement('div', {},
                                React.createElement('label', { className: "block text-sm font-medium text-gray-700 mb-3" },
                                    'What makes your job difficult? ',
                                    React.createElement('span', { className: "text-blue-600 font-medium block" }, 'Pick your TOP 3 biggest problems:')
                                ),
                                React.createElement(CheckboxGroup, {
                                    questionId: 'job_difficulties',
                                    options: [
                                        "Don't know which events to target",
                                        "Takes too long to create proposals",
                                        "Hard to prove we're better than other cities",
                                        "Don't know if our marketing is working",
                                        "Can't track which clients are most valuable",
                                        "Difficult to coordinate with hotels/venues",
                                        "Hard to show results to management",
                                        "Don't have enough information about our competition",
                                        "Systems don't talk to each other"
                                    ],
                                    allowOther: true
                                })
                            ),
                            React.createElement('div', { className: "space-y-4" },
                                React.createElement('h3', { className: "text-lg font-medium text-gray-800" },
                                    'If you had perfect information, what questions would you most want answered?'
                                ),
                                React.createElement('div', { className: "grid grid-cols-1 md:grid-cols-2 gap-4" },
                                    React.createElement('div', {},
                                        React.createElement('label', { className: "block text-sm font-medium text-gray-700 mb-2" }, 'About potential clients:'),
                                        React.createElement(TextArea, { questionId: 'perfect_info_clients', rows: 2 })
                                    ),
                                    React.createElement('div', {},
                                        React.createElement('label', { className: "block text-sm font-medium text-gray-700 mb-2" }, 'About our competition:'),
                                        React.createElement(TextArea, { questionId: 'perfect_info_competition', rows: 2 })
                                    ),
                                    React.createElement('div', {},
                                        React.createElement('label', { className: "block text-sm font-medium text-gray-700 mb-2" }, 'About our performance:'),
                                        React.createElement(TextArea, { questionId: 'perfect_info_performance', rows: 2 })
                                    ),
                                    React.createElement('div', {},
                                        React.createElement('label', { className: "block text-sm font-medium text-gray-700 mb-2" }, 'About market opportunities:'),
                                        React.createElement(TextArea, { questionId: 'perfect_info_market', rows: 2 })
                                    )
                                )
                            )
                        )
                    ),

                    // Part 3: Current Systems
                    React.createElement('div', { className: "bg-white rounded-lg shadow-lg mb-4" },
                        React.createElement(SectionHeader, { 
                            id: 'section3', 
                            title: 'Part 3: Current Information & Systems', 
                            icon: '💾', 
                            isExpanded: expandedSections.section3,
                            color: 'indigo'
                        }),
                        expandedSections.section3 && React.createElement('div', { className: "p-6 space-y-6" },
                            React.createElement('div', {},
                                React.createElement('label', { className: "block text-sm font-medium text-gray-700 mb-3" },
                                    'What systems/tools do you use regularly? Check all that apply, then add any others:'
                                ),
                                React.createElement(CheckboxGroup, {
                                    questionId: 'systems_used',
                                    options: [
                                        "Email (Outlook, Gmail, etc.)",
                                        "Excel or Google Sheets",
                                        "Event management system",
                                        "Customer/client database",
                                        "Website analytics",
                                        "Social media platforms",
                                        "Financial/accounting system",
                                        "Hotel booking systems",
                                        "Presentation software (PowerPoint, etc.)",
                                        "File sharing (Dropbox, Google Drive, etc.)"
                                    ],
                                    allowOther: true
                                })
                            ),
                            React.createElement('div', {},
                                React.createElement('label', { className: "block text-sm font-medium text-gray-700 mb-3" },
                                    'How do you currently find information you need? Check all that apply:'
                                ),
                                React.createElement(CheckboxGroup, {
                                    questionId: 'info_finding_methods',
                                    options: [
                                        "Ask colleagues who might know",
                                        "Look through multiple computer systems",
                                        "Search through old emails",
                                        "Check Excel spreadsheets or documents",
                                        "Call hotels, venues, or other partners",
                                        "Search the internet or industry websites",
                                        "Look through printed files or folders",
                                        "Try to remember from past experience"
                                    ],
                                    allowOther: true
                                })
                            ),
                            React.createElement('div', {},
                                React.createElement('label', { className: "block text-sm font-medium text-gray-700 mb-3" },
                                    'What information do you wish was easier to find? Check the most frustrating ones, then add details:'
                                ),
                                React.createElement('div', { className: "space-y-3" },
                                    [
                                        { key: "contact_info", label: "Contact information for past clients" },
                                        { key: "event_results", label: "Results from previous events (attendance, revenue, etc.)" },
                                        { key: "competitor_info", label: "Competitor information (what other cities are doing)" },
