<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medellin DMO Technical Systems & Data Infrastructure Request - InsightsLab</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        .section-header { cursor: pointer; transition: all 0.3s ease; }
        .section-header:hover { background-color: #f3f4f6; }
        textarea { min-height: 60px; }
        .table-input { 
            border: 1px solid #d1d5db;
            border-radius: 4px;
            padding: 4px 8px;
            font-size: 14px;
            width: 100%;
            min-width: 120px;
        }
        .table-input:focus {
            outline: none;
            border-color: #3b82f6;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1);
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useCallback } = React;

        // Component definitions outside main function to prevent re-creation on every render
        const SectionHeader = ({ id, title, icon, isExpanded, color = "blue", toggleSection, handleKeyPress }) => (
            React.createElement('div', { 
                className: `bg-${color}-50 border-l-4 border-${color}-500 p-4 cursor-pointer hover:bg-${color}-100 transition-colors section-header`,
                onClick: () => toggleSection(id),
                onKeyPress: (e) => handleKeyPress(e, id),
                role: "button",
                tabIndex: 0,
                'aria-expanded': isExpanded,
                'aria-label': `Toggle ${title} section`
            },
                React.createElement('div', { className: "flex items-center justify-between" },
                    React.createElement('div', { className: "flex items-center space-x-3" },
                        React.createElement('span', { className: "text-2xl", 'aria-hidden': "true" }, icon),
                        React.createElement('h2', { className: "text-xl font-semibold text-gray-800" }, title)
                    ),
                    React.createElement('span', { className: "text-gray-600", 'aria-hidden': "true" }, isExpanded ? '▼' : '▶')
                )
            )
        );

        const TextArea = ({ questionId, placeholder = "Please provide details...", rows = 3, responses, updateResponse }) => (
            React.createElement('textarea', {
                className: 'w-full px-3 py-2 border border-gray-300 rounded-md resize-none focus:ring-2 focus:ring-blue-500 focus:border-transparent',
                rows: rows,
                placeholder: placeholder,
                value: responses[questionId] || '',
                onChange: (e) => updateResponse(questionId, e.target.value)
            })
        );

        const CheckboxGroup = ({ questionId, options, allowOther = false, otherLabel = "Other", responses, updateResponse }) => (
            React.createElement('div', { className: "space-y-2" },
                options.map((option, index) =>
                    React.createElement('label', { key: index, className: "flex items-start space-x-3 p-2 hover:bg-gray-50 rounded" },
                        React.createElement('input', {
                            type: 'checkbox',
                            className: 'mt-1 h-4 w-4 text-blue-600 rounded border-gray-300',
                            checked: (responses[questionId] || []).includes(option),
                            onChange: () => updateResponse(questionId, option, true)
                        }),
                        React.createElement('span', { className: "text-gray-700" }, option)
                    )
                ),
                allowOther && React.createElement('div', { className: "flex items-center space-x-3 p-2" },
                    React.createElement('input', {
                        type: 'checkbox',
                        className: 'mt-1 h-4 w-4 text-blue-600 rounded border-gray-300',
                        checked: responses[`${questionId}_other_checked`] || false,
                        onChange: () => updateResponse(`${questionId}_other_checked`, !responses[`${questionId}_other_checked`])
                    }),
                    React.createElement('div', { className: "flex-1 flex items-center space-x-2" },
                        React.createElement('span', { className: "text-gray-700" }, `${otherLabel}:`),
                        React.createElement('input', {
                            type: 'text',
                            className: 'flex-1 px-3 py-1 border border-gray-300 rounded-md text-sm',
                            placeholder: 'Please specify...',
                            value: responses[`${questionId}_other`] || '',
                            onChange: (e) => updateResponse(`${questionId}_other`, e.target.value)
                        })
                    )
                )
            )
        );

        const RadioGroup = ({ questionId, options, responses, updateResponse }) => (
            React.createElement('div', { className: "space-y-2" },
                options.map((option, index) =>
                    React.createElement('label', { key: index, className: "flex items-center space-x-3 p-2 hover:bg-gray-50 rounded" },
                        React.createElement('input', {
                            type: 'radio',
                            name: questionId,
                            className: 'h-4 w-4 text-blue-600 border-gray-300',
                            checked: responses[questionId] === option,
                            onChange: () => updateResponse(questionId, option)
                        }),
                        React.createElement('span', { className: "text-gray-700" }, option)
                    )
                )
            )
        );

        const TableInput = ({ questionId, placeholder = "", responses, updateResponse }) => (
            React.createElement('input', {
                type: 'text',
                className: 'table-input',
                placeholder: placeholder,
                value: responses[questionId] || '',
                onChange: (e) => updateResponse(questionId, e.target.value)
            })
        );

        function MedellinDataRequestForm() {
            const [expandedSections, setExpandedSections] = useState({
                section1: true,
                section2: false,
                section3: false,
                section4: false,
                section5: false,
                section6: false
            });

            const [responses, setResponses] = useState({});
            const [isSubmitting, setIsSubmitting] = useState(false);
            const [isSubmitted, setIsSubmitted] = useState(false);
            const [saveStatus, setSaveStatus] = useState('');

            // Auto-save functionality
            const debouncedSave = useCallback(
                debounce((data) => {
                    localStorage.setItem('medellin_data_request', JSON.stringify(data));
                    setSaveStatus('Saved');
                    setTimeout(() => setSaveStatus(''), 2000);
                }, 1000),
                []
            );

            useEffect(() => {
                const saved = localStorage.getItem('medellin_data_request');
                if (saved) {
                    setResponses(JSON.parse(saved));
                }
            }, []);

            useEffect(() => {
                if (Object.keys(responses).length > 0) {
                    debouncedSave(responses);
                    setSaveStatus('Saving...');
                }
            }, [responses, debouncedSave]);

            function debounce(func, wait) {
                let timeout;
                return function executedFunction(...args) {
                    const later = () => {
                        clearTimeout(timeout);
                        func(...args);
                    };
                    clearTimeout(timeout);
                    timeout = setTimeout(later, wait);
                };
            }

            const updateResponse = (questionId, value, isMultiple = false) => {
                setResponses(prevResponses => {
                    if (isMultiple) {
                        const currentValues = prevResponses[questionId] || [];
                        const updatedValues = currentValues.includes(value)
                            ? currentValues.filter(v => v !== value)
                            : [...currentValues, value];
                        return { ...prevResponses, [questionId]: updatedValues };
                    } else {
                        return { ...prevResponses, [questionId]: value };
                    }
                });
            };

            const toggleSection = (sectionId) => {
                setExpandedSections(prev => ({
                    ...prev,
                    [sectionId]: !prev[sectionId]
                }));
            };

            const handleKeyPress = (e, sectionId) => {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    toggleSection(sectionId);
                }
            };

            const handleSubmit = async () => {
                if (!responses.contact_name) {
                    alert("Please provide Primary Contact Name.");
                    return;
                }
                
                setIsSubmitting(true);
                
                const payload = {
                    ...responses,
                    submittedAt: new Date().toISOString(),
                    userAgent: navigator.userAgent
                };

                try {
                    const res = await fetch("https://formspree.io/f/mdkzbddk", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            subject: `Medellin DMO Technical Systems Request: ${responses.contact_name}`,
                            _replyto: 'bmac@dmoinsightslab.com',
                            contact_name: responses.contact_name || '',
                            contact_email: responses.contact_email || '',
                            technical_data: JSON.stringify(payload),
                            submitted_at: payload.submittedAt
                        })
                    });

                    if (res.ok) {
                        setIsSubmitted(true);
                        localStorage.removeItem('medellin_data_request');
                    } else {
                        throw new Error("Formspree error");
                    }
                } catch (error) {
                    alert("There was an issue submitting. Please save a backup and email to bmac@dmoinsightslab.com");
                }
                
                setIsSubmitting(false);
            };

            const handleBackup = () => {
                const dataStr = JSON.stringify(responses, null, 2);
                const dataBlob = new Blob([dataStr], { type: 'application/json' });
                const url = URL.createObjectURL(dataBlob);
                const link = document.createElement('a');
                link.href = url;
                link.download = 'medellin-data-request-backup.json';
                link.click();
            };

            if (isSubmitted) {
                return React.createElement('div', { className: "min-h-screen flex items-center justify-center bg-gradient-to-br from-green-50 to-blue-50" },
                    React.createElement('div', { className: "bg-white shadow-xl rounded-xl max-w-xl w-full p-8 text-center" },
                        React.createElement('div', { className: "text-6xl mb-6" }, '✅'),
                        React.createElement('h1', { className: "text-2xl font-bold mb-3" }, 'Thank you!'),
                        React.createElement('p', { className: "mb-4 text-gray-700" }, 'Your technical systems information has been submitted successfully.'),
                        React.createElement('div', { className: "mt-6 text-sm text-gray-500" }, 'Contact: bmac@dmoinsightslab.com')
                    )
                );
            }

            return React.createElement('div', { className: "min-h-screen bg-gray-50 py-8" },
                React.createElement('div', { className: "max-w-4xl mx-auto px-4" },
                    
                    // Header
                    React.createElement('div', { className: "bg-white rounded-lg shadow-lg p-8 mb-6" },
                        React.createElement('div', { className: "text-center" },
                            React.createElement('h1', { className: "text-3xl font-bold text-gray-800 mb-4" }, 'Medellín DMO Technical Systems Request'),
                            React.createElement('h2', { className: "text-xl text-blue-600 mb-4" }, 'Data Infrastructure Assessment - InsightsLab'),
                            React.createElement('div', { className: "bg-blue-50 border border-blue-200 rounded-lg p-4 max-w-2xl mx-auto" },
                                React.createElement('p', { className: "text-gray-700 text-sm mb-2" },
                                    'Technical system details to complement your team\'s business needs survey.'
                                ),
                                React.createElement('p', { className: "text-blue-600 font-medium" },
                                    'Time needed: Please complete within 5 business days'
                                )
                            ),
                            saveStatus && React.createElement('div', { className: `text-sm mt-4 ${saveStatus === 'Saved' ? 'text-green-600' : 'text-blue-600'}` },
                                saveStatus
                            )
                        )
                    ),

                    // Submission Instructions
                    React.createElement('div', { className: "bg-blue-50 border border-blue-200 rounded-lg p-6 mb-6" },
                        React.createElement('h3', { className: "text-lg font-semibold text-blue-800 mb-4 flex items-center" },
                            React.createElement('span', { className: "text-xl mr-2" }, '📋'),
                            'Submission Instructions'
                        ),
                        React.createElement('div', { className: "grid md:grid-cols-2 gap-6 text-sm text-blue-700" },
                            React.createElement('div', {},
                                React.createElement('h4', { className: "font-semibold mb-2" }, 'Completion Method:'),
                                React.createElement('ul', { className: "space-y-1 pl-2" },
                                    React.createElement('li', {}, '• Complete digitally and submit via this form'),
                                    React.createElement('li', {}, '• Schedule technical walkthrough call if needed'),
                                    React.createElement('li', {}, '• Provide system screenshots/documentation if available')
                                )
                            ),
                            React.createElement('div', {},
                                React.createElement('h4', { className: "font-semibold mb-2" }, 'Additional Documentation (if available):'),
                                React.createElement('ul', { className: "space-y-1 text-xs pl-2" },
                                    React.createElement('li', {}, '• System architecture diagrams'),
                                    React.createElement('li', {}, '• Current data flow maps'),
                                    React.createElement('li', {}, '• User manuals or technical documentation'),
                                    React.createElement('li', {}, '• Recent technical assessments or audits'),
                                    React.createElement('li', {}, '• Vendor contracts and licensing information')
                                )
                            )
                        )
                    ),

                    // Contact Information
                    React.createElement('div', { className: "bg-white rounded-lg shadow p-6 mb-6" },
                        React.createElement('h3', { className: "text-lg font-semibold text-gray-800 mb-4" }, 'Contact Information'),
                        React.createElement('div', { className: "grid md:grid-cols-2 gap-4" },
                            React.createElement('div', {},
                                React.createElement('label', { className: "block text-sm font-medium mb-1" }, 
                                    'Primary Contact Name ',
                                    React.createElement('span', { className: "text-red-500" }, '*')
                                ),
                                React.createElement('input', {
                                    className: "w-full px-3 py-2 border border-gray-300 rounded-md",
                                    value: responses.contact_name || "",
                                    onChange: (e) => updateResponse("contact_name", e.target.value),
                                    required: true
                                })
                            ),
                            React.createElement('div', {},
                                React.createElement('label', { className: "block text-sm font-medium mb-1" }, 'Email Address'),
                                React.createElement('input', {
                                    type: "email",
                                    className: "w-full px-3 py-2 border border-gray-300 rounded-md",
                                    value: responses.contact_email || "",
                                    onChange: (e) => updateResponse("contact_email", e.target.value)
                                })
                            )
                        )
                    ),

                    // Section 1: System Architecture & Technical Infrastructure
                    React.createElement('div', { className: "bg-white rounded-lg shadow-lg mb-4" },
                        React.createElement(SectionHeader, { 
                            id: 'section1', 
                            title: 'System Architecture & Technical Infrastructure', 
                            icon: '🏗️', 
                            isExpanded: expandedSections.section1,
                            color: 'blue',
                            toggleSection: toggleSection,
                            handleKeyPress: handleKeyPress
                        }),
                        expandedSections.section1 && React.createElement('div', { className: "p-6 space-y-6" },
                            React.createElement('div', {},
                                React.createElement('label', { className: "block text-sm font-medium text-gray-700 mb-3" },
                                    'Core Technology Platform'
                                ),
                                React.createElement('div', { className: "space-y-4" },
                                    React.createElement('div', {},
                                        React.createElement('p', { className: "text-sm text-gray-600 mb-2" }, 'Primary Operating Systems:'),
                                        React.createElement(RadioGroup, {
                                            questionId: 'operating_systems',
                                            options: ['Windows', 'Mac', 'Linux', 'Mixed'],
                                            responses: responses,
                                            updateResponse: updateResponse
                                        })
                                    ),
                                    React.createElement('div', {},
                                        React.createElement('p', { className: "text-sm text-gray-600 mb-2" }, 'Office Suite:'),
                                        React.createElement(RadioGroup, {
                                            questionId: 'office_suite',
                                            options: ['Microsoft 365', 'Google Workspace', 'Other'],
                                            responses: responses,
                                            updateResponse: updateResponse
                                        }),
                                        responses.office_suite === 'Other' && React.createElement('div', { className: "mt-2" },
                                            React.createElement('input', {
                                                type: 'text',
                                                className: 'w-full px-3 py-2 border border-gray-300 rounded-md text-sm',
                                                placeholder: 'Please specify...',
                                                value: responses.office_suite_other || '',
                                                onChange: (e) => updateResponse('office_suite_other', e.target.value)
                                            })
                                        )
                                    ),
                                    React.createElement('div', {},
                                        React.createElement('p', { className: "text-sm text-gray-600 mb-2" }, 'Internet Connectivity:'),
                                        React.createElement(RadioGroup, {
                                            questionId: 'internet_connectivity',
                                            options: ['Dedicated business line', 'Standard broadband', 'Shared/Limited'],
                                            responses: responses,
                                            updateResponse: updateResponse
                                        })
                                    ),
                                    React.createElement('div', {},
                                        React.createElement('p', { className: "text-sm text-gray-600 mb-2" }, 'Cloud Services Usage:'),
                                        React.createElement(RadioGroup, {
                                            questionId: 'cloud_usage',
                                            options: ['Heavy', 'Moderate', 'Minimal', 'None'],
                                            responses: responses,
                                            updateResponse: updateResponse
                                        })
                                    ),
                                    React.createElement('div', {},
                                        React.createElement('p', { className: "text-sm text-gray-600 mb-2" }, 'IT Support Structure:'),
                                        React.createElement(RadioGroup, {
                                            questionId: 'it_support',
                                            options: ['In-house IT', 'External vendor', 'Hybrid', 'Ad-hoc'],
                                            responses: responses,
                                            updateResponse: updateResponse
                                        })
                                    )
                                )
                            ),

                            React.createElement('div', {},
                                React.createElement('label', { className: "block text-sm font-medium text-gray-700 mb-3" },
                                    'Key Personnel for Technical Discussions'
                                ),
                                React.createElement('div', { className: "overflow-x-auto" },
                                    React.createElement('table', { className: "min-w-full border border-gray-300" },
                                        React.createElement('thead', { className: "bg-gray-50" },
                                            React.createElement('tr', {},
                                                React.createElement('th', { className: "px-4 py-2 text-left text-sm font-medium text-gray-700 border-b" }, 'Role'),
                                                React.createElement('th', { className: "px-4 py-2 text-left text-sm font-medium text-gray-700 border-b" }, 'Name'),
                                                React.createElement('th', { className: "px-4 py-2 text-left text-sm font-medium text-gray-700 border-b" }, 'Email'),
                                                React.createElement('th', { className: "px-4 py-2 text-left text-sm font-medium text-gray-700 border-b" }, 'Technical Expertise Level')
                                            )
                                        ),
                                        React.createElement('tbody', {},
                                            ['IT Manager/Lead', 'System Administrator', 'Database Manager', 'Web/Digital Manager'].map((role, index) =>
                                                React.createElement('tr', { key: index, className: "border-b" },
                                                    React.createElement('td', { className: "px-4 py-2 text-sm text-gray-700" }, role),
                                                    React.createElement('td', { className: "px-4 py-2" },
                                                        React.createElement(TableInput, {
                                                            questionId: `personnel_name_${index}`,
                                                            placeholder: 'Name',
                                                            responses: responses,
                                                            updateResponse: updateResponse
                                                        })
                                                    ),
                                                    React.createElement('td', { className: "px-4 py-2" },
                                                        React.createElement(TableInput, {
                                                            questionId: `personnel_email_${index}`,
                                                            placeholder: 'Email',
                                                            responses: responses,
                                                            updateResponse: updateResponse
                                                        })
                                                    ),
                                                    React.createElement('td', { className: "px-4 py-2" },
                                                        React.createElement(TableInput, {
                                                            questionId: `personnel_level_${index}`,
                                                            placeholder: 'Expertise Level',
                                                            responses: responses,
                                                            updateResponse: updateResponse
                                                        })
                                                    )
                                                )
                                            )
                                        )
                                    )
                                )
                            )
                        )
                    ),

                    // Section 2: Business-Critical Systems Inventory
                    React.createElement('div', { className: "bg-white rounded-lg shadow-lg mb-4" },
                        React.createElement(SectionHeader, { 
                            id: 'section2', 
                            title: 'Business-Critical Systems Inventory', 
                            icon: '💾', 
                            isExpanded: expandedSections.section2,
                            color: 'blue',
                            toggleSection: toggleSection,
                            handleKeyPress: handleKeyPress
                        }),
                        expandedSections.section2 && React.createElement('div', { className: "p-6 space-y-6" },
                            // Event Management Systems
                            React.createElement('div', {},
                                React.createElement('h4', { className: "text-lg font-semibold text-gray-800 mb-4" }, 'Event Management Systems'),
                                React.createElement('div', { className: "overflow-x-auto" },
                                    React.createElement('table', { className: "min-w-full border border-gray-300" },
                                        React.createElement('thead', { className: "bg-gray-50" },
                                            React.createElement('tr', {},
                                                React.createElement('th', { className: "px-4 py-2 text-left text-sm font-medium text-gray-700 border-b" }, 'System Component'),
                                                React.createElement('th', { className: "px-4 py-2 text-left text-sm font-medium text-gray-700 border-b" }, 'Details')
                                            )
                                        ),
                                        React.createElement('tbody', {},
                                            [
                                                { label: 'Event Management Platform', field: 'event_platform', placeholder: 'Name, Vendor, Version' },
                                                { label: 'User Count', field: 'event_users', placeholder: 'Total licensed users, Active users' },
                                                { label: 'Last Update/Upgrade', field: 'event_update', placeholder: 'Date, Version' },
                                                { label: 'Data Retention', field: 'event_retention', placeholder: 'Historical data available from' }
                                            ].map((item, index) =>
                                                React.createElement('tr', { key: index, className: "border-b" },
                                                    React.createElement('td', { className: "px-4 py-2 text-sm text-gray-700 font-medium" }, item.label),
                                                    React.createElement('td', { className: "px-4 py-2" },
                                                        React.createElement(TableInput, {
                                                            questionId: item.field,
                                                            placeholder: item.placeholder,
                                                            responses: responses,
                                                            updateResponse: updateResponse
                                                        })
                                                    )
                                                )
                                            )
                                        )
                                    )
                                ),
                                React.createElement('div', { className: "mt-4" },
                                    React.createElement('label', { className: "block text-sm font-medium text-gray-700 mb-2" }, 'Core Functions:'),
                                    React.createElement(CheckboxGroup, {
                                        questionId: 'event_functions',
                                        options: ['Event registration', 'Lead tracking', 'Venue management', 'Proposal generation'],
                                        allowOther: true,
                                        responses: responses,
                                        updateResponse: updateResponse
                                    })
                                ),
                                React.createElement('div', { className: "mt-4" },
                                    React.createElement('label', { className: "block text-sm font-medium text-gray-700 mb-2" }, 'Data Export Capabilities:'),
                                    React.createElement(CheckboxGroup, {
                                        questionId: 'event_export',
                                        options: ['Excel/CSV', 'PDF reports', 'API access', 'Database direct access', 'None'],
                                        responses: responses,
                                        updateResponse: updateResponse
                                    })
                                )
                            ),

                            // CRM & Client Management
                            React.createElement('div', {},
                                React.createElement('h4', { className: "text-lg font-semibold text-gray-800 mb-4" }, 'CRM & Client Management'),
                                React.createElement('div', { className: "overflow-x-auto" },
                                    React.createElement('table', { className: "min-w-full border border-gray-300" },
                                        React.createElement('thead', { className: "bg-gray-50" },
                                            React.createElement('tr', {},
                                                React.createElement('th', { className: "px-4 py-2 text-left text-sm font-medium text-gray-700 border-b" }, 'System Component'),
                                                React.createElement('th', { className: "px-4 py-2 text-left text-sm font-medium text-gray-700 border-b" }, 'Details')
                                            )
                                        ),
                                        React.createElement('tbody', {},
                                            [
                                                { label: 'CRM Platform', field: 'crm_platform', placeholder: 'Name, Vendor, Cloud/On-premise' },
                                                { label: 'Database Size', field: 'crm_size', placeholder: 'Approximate records, Annual growth' },
                                                { label: 'Access Controls', field: 'crm_access', placeholder: 'Role-based access: Yes/No, Admin users' }
                                            ].map((item, index) =>
                                                React.createElement('tr', { key: index, className: "border-b" },
                                                    React.createElement('td', { className: "px-4 py-2 text-sm text-gray-700 font-medium" }, item.label),
                                                    React.createElement('td', { className: "px-4 py-2" },
                                                        React.createElement(TableInput, {
                                                            questionId: item.field,
                                                            placeholder: item.placeholder,
                                                            responses: responses,
                                                            updateResponse: updateResponse
                                                        })
                                                    )
                                                )
                                            )
                                        )
                                    )
                                ),
                                React.createElement('div', { className: "mt-4" },
                                    React.createElement('label', { className: "block text-sm font-medium text-gray-700 mb-2" }, 'Data Categories:'),
                                    React.createElement(CheckboxGroup, {
                                        questionId: 'crm_categories',
                                        options: ['Contact info', 'Event history', 'Communications log', 'Preferences', 'Financial history'],
                                        responses: responses,
                                        updateResponse: updateResponse
                                    })
                                ),
                                React.createElement('div', { className: "mt-4" },
                                    React.createElement('label', { className: "block text-sm font-medium text-gray-700 mb-2" }, 'Data Quality Issues:'),
